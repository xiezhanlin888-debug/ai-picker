<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI 选股 · 短线终端</title>
<style>
:root[data-theme="light"]{
  --bg:#F2F2F7; --bg2:#FFFFFF; --card:#FFFFFF; --text:#0B0B0E; --text2:#3C3C43;
  --sub:#8A8A8E; --sub2:#AEAEB2; --line:#E5E5EA; --line2:#F1F1F5;
  --blue:#0A6CFF; --red:#F5333F; --green:#00A96E; --orange:#FF9500; --purple:#8A4BFF; --yellow:#D9A800;
  --chip:rgba(10,108,255,.10); --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -18px rgba(0,0,0,.20);
  --skeleton:linear-gradient(90deg,#EFEFF3 25%,#F7F7FA 50%,#EFEFF3 75%);
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#121317; --card:#15171C; --text:#F5F6FA; --text2:#CDD0D8;
  --sub:#84888F; --sub2:#5E626B; --line:#23252B; --line2:#1A1C21;
  --blue:#4C9BFF; --red:#FF5A63; --green:#2BD694; --orange:#FFA733; --purple:#B48AFF; --yellow:#FFD84D;
  --chip:rgba(76,155,255,.15); --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 28px -18px rgba(0,0,0,.9);
  --skeleton:linear-gradient(90deg,#1B1D23 25%,#23252C 50%,#1B1D23 75%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  font-size:15px;padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  transition:background .25s;
}
.topbar .title{font-size:20px;font-weight:800;letter-spacing:-.5px;flex:1;display:flex;align-items:baseline;gap:6px}
.topbar .title em{font-style:normal;font-size:11px;font-weight:600;color:var(--sub);letter-spacing:0}
.iconbtn{
  width:36px;height:36px;border-radius:12px;border:none;
  background:var(--bg2);color:var(--text);font-size:16px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0;transition:transform .16s ease,background .16s;
}
.iconbtn:active{transform:scale(.88);background:var(--line)}
/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border-radius:18px;margin:0 12px 12px;padding:15px;
  box-shadow:var(--shadow);animation:cardIn .34s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.card h2{margin:0 0 11px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.card h2 .dot{width:6px;height:6px;border-radius:99px;background:var(--blue);box-shadow:0 0 0 3px var(--chip)}
.card h2 .tag{margin-left:auto;font-size:10px;font-weight:600;color:var(--sub2);letter-spacing:0}
.hero{
  position:relative;margin:0 12px 12px;border-radius:20px;padding:17px;overflow:hidden;
  background:var(--card);box-shadow:var(--shadow);animation:cardIn .34s cubic-bezier(.22,.9,.3,1) both;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 100% 0%,var(--chip),transparent 62%);
}
/* ---------- 行 ---------- */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;min-height:44px;position:relative;transition:background .12s}
.row+.row{box-shadow:inset 0 1px 0 var(--line2)}
.row.click{cursor:pointer}
.row.click:active{background:var(--line2)}
.row.click:active .nm{opacity:.75}
.grow{flex:1;min-width:0}
.nm{font-weight:650;font-size:15.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .12s}
.sub{font-size:11.5px;color:var(--sub);line-height:1.45}
.right{text-align:right;flex-shrink:0}
.red{color:var(--red)}.green{color:var(--green)}
.num{font-variant-numeric:tabular-nums}
/* ---------- 徽标 ---------- */
.badge{display:inline-block;font-size:10.5px;padding:2.5px 7px;border-radius:7px;margin:3px 4px 0 0;background:var(--chip);color:var(--blue);font-weight:650}
.badge.warn{background:rgba(255,149,0,.15);color:var(--orange)}
.badge.ok{background:rgba(0,169,110,.15);color:var(--green)}
.badge.bad{background:rgba(245,51,63,.15);color:var(--red)}
.score{font-weight:800;font-size:20px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
/* ---------- 按钮 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:13px;border:none;border-radius:14px;background:var(--blue);color:#fff;
  font-size:15.5px;font-weight:650;margin-top:10px;cursor:pointer;font-family:inherit;
  transition:transform .15s cubic-bezier(.2,.9,.3,1),opacity .15s,background .2s;
  box-shadow:0 6px 16px -10px rgba(10,108,255,.9);
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.ghost{background:var(--bg2);color:var(--blue);box-shadow:none}
.btn.soft{background:var(--chip);color:var(--blue);box-shadow:none}
.btn.danger{background:var(--red);box-shadow:0 6px 16px -10px rgba(245,51,63,.9)}
.btn:disabled{opacity:.45;transform:none}
.btn.sm{display:inline-flex;width:auto;padding:8px 14px;font-size:13px;border-radius:11px;margin:0;box-shadow:none}
.btns{display:flex;gap:9px;margin-top:10px}
.btns .btn{margin-top:0}
/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--bg2);background:color-mix(in srgb,var(--bg2) 90%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;padding:8px 1px 7px;background:none;border:none;color:var(--sub);
  font-size:9.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:color .2s;position:relative;font-family:inherit;
}
.tabbar button .ic{font-size:17px;line-height:1;transition:transform .28s cubic-bezier(.2,1.4,.4,1)}
.tabbar button.active{color:var(--blue)}
.tabbar button.active .ic{transform:translateY(-2px) scale(1.12)}
.tabbar button:active .ic{transform:scale(.86)}
/* ---------- 表单 ---------- */
input,select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg2);color:var(--text);font-size:15px;margin:5px 0 12px;font-family:inherit;
  transition:border-color .18s,box-shadow .18s;
}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3.5px var(--chip)}
label{font-size:12px;color:var(--sub);font-weight:600;display:block;margin-top:2px}
input[type=range]{
  padding:0;border:none;background:transparent;height:30px;accent-color:var(--blue);margin:2px 0 10px;
}
/* ---------- 网格 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.cell{padding:11px 12px;border-radius:13px;background:var(--bg2);transition:transform .15s}
.cell:active{transform:scale(.985)}
.cell .t{font-size:10.5px;color:var(--sub);font-weight:600;letter-spacing:.2px}
.cell .v{font-size:16px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
/* ---------- 其他 ---------- */
.note{font-size:11px;color:var(--sub);line-height:1.65}
.hint{padding:38px 22px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}
.progress{height:5px;background:var(--line2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s ease;border-radius:99px}
.toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(8px);
  background:rgba(22,22,26,.94);color:#fff;padding:11px 18px;border-radius:13px;font-size:13.5px;
  z-index:99;max-width:84%;text-align:center;backdrop-filter:blur(12px);
  animation:toastIn .26s cubic-bezier(.2,.9,.3,1) forwards;font-weight:500;
}
@keyframes toastIn{to{transform:translateX(-50%) translateY(0);opacity:1}}
.hidden{display:none!important}
svg.chart{width:100%;display:block;overflow:visible}
/* 分段控件 */
.seg{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:13px}
.seg button{
  flex:1;padding:8px 4px;border:none;background:none;color:var(--sub);font-size:12.5px;
  font-weight:650;border-radius:10px;cursor:pointer;transition:background .2s,color .2s,transform .12s;font-family:inherit;
}
.seg button:active{transform:scale(.96)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* 分布条 */
.dist{display:flex;align-items:center;gap:9px;margin:4px 0;font-size:11px}
.dist .lbl{width:48px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.dist .bar{flex:1;height:15px;background:var(--bg2);border-radius:5px;overflow:hidden}
.dist .bar>i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.2,.9,.3,1)}
.dist .cnt{width:42px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
/* 模态 */
.modal{
  position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:modalIn .3s cubic-bezier(.22,.9,.3,1);
}
@keyframes modalIn{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.modal .mhead{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 11px;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.modal .mhead .t{flex:1;font-weight:750;font-size:16.5px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-body{padding:2px 12px calc(30px + env(safe-area-inset-bottom))}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px}
.kv+.kv{box-shadow:inset 0 1px 0 var(--line2)}
.kv .k{color:var(--sub)}
.kv .v{font-weight:650;font-variant-numeric:tabular-nums}
/* 骨架屏 */
.sk{height:14px;border-radius:7px;background:var(--skeleton);background-size:200% 100%;animation:shimmer 1.25s infinite linear;margin:7px 0}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.sk.w40{width:40%}.sk.w60{width:60%}.sk.w80{width:80%}
/* 加载转圈 */
.spin{width:15px;height:15px;border:2px solid var(--chip);border-top-color:var(--blue);border-radius:99px;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 保存条 */
.savebar{
  position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;
  margin:0 12px 12px;animation:cardIn .3s cubic-bezier(.22,.9,.3,1) both;
}
.savebar .btn{box-shadow:0 10px 26px -12px rgba(10,108,255,.95)}
/* 数值跳动 */
.flash{animation:flash .5s ease}
@keyframes flash{0%{background:var(--chip)}100%{background:transparent}}
/* ---------- 日志 ---------- */
.logbox{
  max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg2);border-radius:13px;padding:10px 11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.logline{font-size:11px;line-height:1.55;padding:3px 0;border-bottom:1px dashed var(--line2);word-break:break-all;animation:logIn .2s ease}
.logline:last-child{border-bottom:none}
.logline .tm{color:var(--sub2);margin-right:6px}
.logline.info{color:var(--text2)}
.logline.success{color:var(--green)}
.logline.warn{color:var(--orange)}
.logline.error{color:var(--red)}
.logline.tool{color:var(--blue)}
.logline.ai{color:var(--purple)}
.logline.trade{color:var(--yellow);font-weight:600}
@keyframes logIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">AI 选股<em id="subTitle">短线终端</em></div>
  <button class="iconbtn" id="btnSearch" aria-label="搜索">⌕</button>
  <button class="iconbtn" id="btnTheme" aria-label="主题">◐</button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="day" class="active"><span class="ic">⚡</span>短线</button>
  <button data-tab="market"><span class="ic">◎</span>行情</button>
  <button data-tab="watch"><span class="ic">★</span>自选</button>
  <button data-tab="paper"><span class="ic">▤</span>模拟盘</button>
  <button data-tab="log"><span class="ic">▦</span>日志</button>
  <button data-tab="settings"><span class="ic">⚙</span>设置</button>
</nav>

<div id="modal" class="modal hidden"></div>

<script>
"use strict";

/* ============================================================
   常量与数据源
   ============================================================ */
var EM_CLIST = "https://push2.eastmoney.com/api/qt/clist/get";
var EM_ULIST = "https://push2.eastmoney.com/api/qt/ulist.np/get";
var EM_KLINE = "https://push2his.eastmoney.com/api/qt/stock/kline/get";
var SINA_LIST = "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData";
var SINA_JSONP = "https://money.finance.sina.com.cn/quotes_service/api/jsonp_v2.php/__CB__/Market_Center.getHQNodeData";
var UT = "bd1d9ddb04089700cf9c27f6f7426281";
var FS = "m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23";
var FIELDS = "f2,f3,f5,f6,f7,f8,f9,f10,f12,f13,f14,f15,f16,f17,f18,f20,f21,f23,f62,f100,f184";
var PAGE_SIZE = 100;
var INDICES = [
  { code: "000001", market: 1, name: "上证指数" },
  { code: "399001", market: 0, name: "深证成指" },
  { code: "399006", market: 0, name: "创业板指" }
];

var DEFAULTS = {
  baseUrl: "https://api.deepseek.com", model: "deepseek-chat", key: "",
  targetPct: 2.5, stopPct: 2.5, maxPositions: 3, positionPct: 20,
  minAmount: 2, minFloatCap: 30, excludeST: true, excludeLimit: true,
  candidateCount: 30, initialCapital: 100000, costPct: 0.0005,
  strategy: "limitup", theme: "auto", autoTradeOnOpen: false,
  strictMode: true, tradeWindowEnabled: true
};

var STRAT = {
  limitup:  { label: "涨停基因", tip: "有涨停历史 + 尾盘走强，博隔日溢价" },
  capital:  { label: "主力抢筹", tip: "重仓看主力净流入占比与量比，跟资金走" },
  pullback: { label: "回踩低吸", tip: "强势股回踩均线不破，低吸等反弹" },
  breakout: { label: "趋势突破", tip: "均线多头排列 + 放量突破，做趋势延续" }
};

/* ============================================================
   存储 / 主题
   ============================================================ */
function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function loadSettings() {
  var s = load("aip_settings", {});
  var out = {};
  Object.keys(DEFAULTS).forEach(function (k) { out[k] = (k in s) ? s[k] : DEFAULTS[k]; });
  return out;
}
function saveSettings(s) { save("aip_settings", s); }
function loadAccount() { return load("aip_account", null); }
function saveAccount(a) { save("aip_account", a); }
function loadWatch() { return load("aip_watch", []); }
function saveWatch(w) { save("aip_watch", w); }
function resetAccount(st) {
  var a = { initialCapital: st.initialCapital, cash: st.initialCapital, positions: [], trades: [], equityHistory: [{ date: todayStr(), equity: st.initialCapital }] };
  saveAccount(a); return a;
}
function systemTheme() {
  try { return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  catch (e) { return "light"; }
}
function applyTheme(theme) {
  var t = theme === "auto" ? systemTheme() : theme;
  document.documentElement.setAttribute("data-theme", t);
  var meta = document.getElementById("metaTheme");
  if (meta) meta.setAttribute("content", t === "dark" ? "#000000" : "#F2F2F7");
  var btn = document.getElementById("btnTheme");
  if (btn) btn.textContent = theme === "auto" ? "◐" : (theme === "dark" ? "☾" : "☀");
}
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

/* ============================================================
   实时日志
   ============================================================ */
var LOGS = [];
function logTime(ts) {
  var d = new Date(ts);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
}
function logLineHtml(e) {
  return '<span class="tm">' + logTime(e.t) + "</span>" + esc(e.msg);
}
function log(level, msg) {
  var e = { t: Date.now(), level: level || "info", msg: String(msg) };
  LOGS.push(e);
  if (LOGS.length > 800) LOGS.shift();
  var box = document.getElementById("logBox");
  if (box) {
    var d = document.createElement("div");
    d.className = "logline " + e.level;
    d.innerHTML = logLineHtml(e);
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    var cnt = document.getElementById("logCount");
    if (cnt) cnt.textContent = LOGS.length + " 条";
  }
}

/* ============================================================
   剪贴板（兼容 WebView）
   ============================================================ */
function copyText(txt) {
  return new Promise(function (resolve) {
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = txt;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        ta.style.top = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ta.parentNode) ta.remove();
        return ok;
      } catch (e) { return false; }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { resolve(true); }, function () { resolve(fallback()); });
        return;
      }
    } catch (e) {}
    resolve(fallback());
  });
}
function doCopy(txt, label) {
  copyText(txt).then(function (ok) {
    haptic(10);
    toast(ok ? (label || "已复制") : "复制失败，请手动选择文本");
    log(ok ? "success" : "warn", "复制" + (label || "文本") + (ok ? "成功" : "失败"));
  });
}

/* ============================================================
   工具
   ============================================================ */
function num(v) {
  if (typeof v === "number" && isFinite(v)) return v;
  if (typeof v === "string") {
    var t = v.trim();
    if (t === "" || t === "-" || t === "--" || t === "null") return 0;
    var n = Number(t); return isFinite(n) ? n : 0;
  }
  return 0;
}
function text(v) { return typeof v === "string" ? v : (typeof v === "number" ? String(v) : ""); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function r2(v) { return Math.round(v * 100) / 100; }
function money(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  var a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + "万亿";
  if (a >= 1e8) return (v / 1e8).toFixed(2) + "亿";
  if (a >= 1e4) return (v / 1e4).toFixed(1) + "万";
  return v.toFixed(0);
}
function pct(v, d) {
  d = (d === undefined) ? 2 : d;
  if (v === null || v === undefined || !isFinite(v)) return "—";
  return (v >= 0 ? "+" : "") + v.toFixed(d) + "%";
}
function chgColor(v) {
  if (v === null || v === undefined || !isFinite(v) || v === 0) return "var(--sub)";
  return v > 0 ? "var(--red)" : "var(--green)";
}

  var a = arr.slice().sort(function (x, y) { return x - y; });

}

/* ============================================================
   网络（原生 HTTP 优先）
   ============================================================ */
var NATIVE_HTTP = null;
try {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp) {
    NATIVE_HTTP = window.Capacitor.Plugins.CapacitorHttp;
  }
} catch (e) { NATIVE_HTTP = null; }

var NET_LOG = [];
var NET_QUIET = false;   // 自检探针期间静音，避免把“预期失败”写进错误列表
function logNet(msg) {
  if (NET_QUIET) return;
  NET_LOG.push(new Date().toTimeString().slice(0, 8) + " " + msg);
  if (NET_LOG.length > 30) NET_LOG.shift();
}
function resp(status, body) {
  return { ok: status >= 200 && status < 300, status: status, text: function () { return Promise.resolve(body); } };
}

async function netFetch(url, opts) {
  opts = opts || {};
  var timeoutMs = opts.timeout || 22000;
  var method = opts.method || "GET";
  var headers = opts.headers || {};

  // 1) 优先用 WebView 浏览器级 fetch（TLS 指纹同浏览器，兼容中国行情站 WAF）
  var ctrl = null, timer = null;
  if (typeof AbortController !== "undefined") {
    ctrl = new AbortController();
    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, timeoutMs);
  }
  try {
    var o = { method: method, headers: headers };
    if (opts.body) o.body = opts.body;
    if (ctrl) o.signal = ctrl.signal;
    var r = await fetch(url, o);
    if (r) return r;
  } catch (e) {
    logNet("fetch 失败 " + (e && e.message ? e.message : e) + " " + url.slice(0, 50));
  } finally {
    if (timer) clearTimeout(timer);
  }

  // 2) 回退：Capacitor 原生 HTTP（绕过部分 WebView 限制 / 需要免 CORS 时）
  if (NATIVE_HTTP) {
    try {
      var p = { url: url, method: method, headers: headers, connectTimeout: timeoutMs, readTimeout: timeoutMs, responseType: "text" };
      if (opts.body) { try { p.data = JSON.parse(opts.body); } catch (e) { p.data = opts.body; } }
      var res = await NATIVE_HTTP.request(p);
      var body = res && res.data;
      if (typeof body !== "string") body = (body === undefined || body === null) ? "" : JSON.stringify(body);
      return resp((res && res.status) || 0, body);
    } catch (e) {
      logNet("native 失败 " + (e && e.message ? e.message : e));
    }
  }
  throw new Error("网络请求失败");
}

/* ============================================================
   JSONP 通道（script 标签，彻底绕过 CORS）
   关键：新浪 json_v2 的 ACAO 头时有时无，浏览器会随机报跳域失败；
   jsonp_v2 始终返回任意域名可加载的 JS，且不像 fetch 那样受 CORS 约束。
   ============================================================ */
var _jpSeq = 0;
function canJsonp() {
  return typeof document !== "undefined" && !!document.head && typeof window !== "undefined";
}
function jsonpGet(url, cbInPath, timeoutMs) {
  return new Promise(function (resolve, reject) {
    if (!canJsonp()) { reject(new Error("no-jsonp")); return; }
    var name = "__jp" + (++_jpSeq) + "_" + Math.floor(Math.random() * 99999);
    var finalUrl = cbInPath
      ? url.replace("__CB__", name)
      : url + (url.indexOf("?") >= 0 ? "&" : "?") + "cb=" + name;
    var s = document.createElement("script");
    var settled = false;
    var timer = setTimeout(function () { finish(new Error("JSONP 超时")); }, timeoutMs || 15000);
    function finish(err, data) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { window[name] = function () {}; } catch (e) {}
      try { if (s.parentNode) s.parentNode.removeChild(s); } catch (e) {}
      if (err) reject(err); else resolve(data);
    }
    window[name] = function (data) { finish(null, data); };
    s.onerror = function () { finish(new Error("JSONP 加载失败")); };
    s.async = true;
    s.charset = "utf-8";
    s.src = finalUrl;
    try { document.head.appendChild(s); } catch (e) { finish(e); }
  });
}

/** 东财接口：支持 cb= 参数，优先 JSONP */
async function emJson(url, retries) {
  if (canJsonp()) {
    try {
      var d = await jsonpGet(url, false, 12000);
      if (d !== undefined && d !== null) return d;
    } catch (e) { logNet("EM jsonp 失败 " + (e && e.message ? e.message : e)); }
  }
  return await getJson(url, retries === undefined ? 2 : retries);
}

async function getJson(url, retries, headers) {
  retries = (retries === undefined) ? 2 : retries;
  var err = null;
  for (var a = 0; a <= retries; a++) {
    try {
      var r = await netFetch(url, { headers: headers || {} });
      if (r.ok) {
        var t = await r.text();
        if (t && t.trim()) {
          var s = t.trim();
          if (s === "null" || s === "[]") return null;
          return JSON.parse(s);
        }
      }
      err = new Error("HTTP " + r.status);
    } catch (e) { err = e; }
    if (a < retries) await sleep(350 * (a + 1));
  }
  throw err instanceof Error ? err : new Error("请求失败");
}

async function sinaPage(page) {

async function sinaSnapshot(onP) {
  var all = [];
  var BATCH = 8;
  var MAXP = 62;              // ~5600 只 / 100 页
  var emptyStreak = 0;
  var failed = [];

  for (var page = 1; page <= MAXP; page += BATCH) {
    var nums = [];
    for (var i = 0; i < BATCH && page + i <= MAXP; i++) nums.push(page + i);
    var res = await Promise.all(nums.map(function (p) {
      return sinaPage(p).then(function (r) { return r; }).catch(function () { return null; });
    }));
    var got = 0;
    res.forEach(function (rows, k) {
      if (rows === null) { failed.push(nums[k]); return; }   // 失败页稍后重试
      if (rows.length) { got += rows.length; }
      for (var m = 0; m < rows.length; m++) all.push(rows[m]);
    });
    if (got === 0) { emptyStreak++; if (emptyStreak >= 2 && all.length) break; }
    else emptyStreak = 0;
    if (onP) onP(Math.min(all.length, 5600), 5600);
  }

  // 失败页重试一轮
  if (failed.length) {
    logNet("新浪 " + failed.length + " 页失败，重试中");
    for (var f = 0; f < failed.length; f += 6) {
      var chunk = failed.slice(f, f + 6);
      var rs = await Promise.all(chunk.map(function (p) {
        return sinaPage(p).catch(function () { return null; });
      }));
      rs.forEach(function (rows) { if (rows) for (var m = 0; m < rows.length; m++) all.push(rows[m]); });
    }
  }

  if (!all.length) throw new Error("新浪快照无数据");

  // 去重
  var seen = {}, out = [];
  for (var z = 0; z < all.length; z++) {
    var q = all[z];
    if (!q.code || seen[q.code]) continue;
    seen[q.code] = 1;
    out.push(q);
  }
  if (out.length < 1000) logNet("新浪快照偏少：" + out.length + " 只（失败页 " + failed.length + "）");
  return out;
}

/* ============================================================

   ============================================================ */
function nowMinutes() {
  var d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function isTradingDay() {
  var day = new Date().getDay();
  return day >= 1 && day <= 5; // 周一~周五
}
function inTradeWindow() {
  return isTradingDay() && nowMinutes() >= (14 * 60 + 30) && nowMinutes() <= (15 * 60);
}
function tradeWindowText() {
  var d = new Date();
  var hh = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  if (!isTradingDay()) return "周末/非交易日";

}

/**
 * 严格尾盘 8 规则（硬过滤，逐条对应）：
 *  1 时间    → 由交易时段闸门控制（tradeWindowEnabled）
 *  2 主板涨幅 3–5%
 *  3 近20日涨停 → 需 K 线（在评分阶段过滤）
 *  4 量比 ≥1
 *  5 换手 5–10%
 *  6 总市值 50–200 亿
 *  7 分时站上均价（现价 ≥ 成交均价，且最低价未深跌破均价）
 *  8 强于大盘（涨幅 > 基准 + 0.5）
 */
function strictFilter(q, benchmark) {
  if (!q.code || !q.name) return false;
  if (q.price <= 0) return false;
  // 规则2：主板 + 涨幅 3%–5%（60沪主板 / 00深主板，排除 30创业板、68/689科创板、8/4/92北交所）
  var isMain = /^60/.test(q.code) || /^00/.test(q.code);
  if (!isMain) return false;
  if (q.changePct < 3 || q.changePct > 5) return false;
  // 规则4：量比≥1 —— 新浪源无量比，改为 enrich 补全后再过滤（见 runDayScan）
  // 规则5：换手 5%–10%
  if ((q.turnover || 0) < 5 || (q.turnover || 0) > 10) return false;
  // 规则6：总市值 50–200 亿
  if (q.totalCap < 50e8 || q.totalCap > 200e8) return false;
  // 规则7：分时站上均价（均价 = 成交额 / 成交量，最低价未深跌破均价）
  var vwap = (q.volume > 0 && q.amount > 0) ? q.amount / (q.volume * 100) : 0;
  if (vwap > 0 && q.price < vwap) return false;
  if (vwap > 0 && q.low > 0 && q.low < vwap * 0.98) return false;
  // 规则8：强于大盘
  if (benchmark !== null && benchmark !== undefined && isFinite(benchmark)) {
    if (q.changePct <= benchmark + 0.5) return false;
  }
  return true;
}
function strictRuleTags(q, benchmark, limitUps) {
  var tags = [];
  if (q.changePct >= 3 && q.changePct <= 5) tags.push("涨幅3-5%");
  if ((q.volumeRatio || 0) >= 1) tags.push("量比≥1");
  if ((q.turnover || 0) >= 5 && (q.turnover || 0) <= 10) tags.push("换手5-10%");
  if (q.totalCap >= 50e8 && q.totalCap <= 200e8) tags.push("市值50-200亿");
  if (limitUps >= 1) tags.push("20日有涨停");
  if (benchmark !== null && benchmark !== undefined && q.changePct > benchmark) tags.push("强于大盘");
  return tags;
}

/* ============================================================
   市场统计
   ============================================================ */
function buildPulse(quotes) {
  var act = quotes.filter(function (q) { return q.price > 0; });
  var ch = act.map(function (q) { return q.changePct; });
  var up = ch.filter(function (c) { return c > 0; }).length;
  var down = ch.filter(function (c) { return c < 0; }).length;
  var flat = ch.length - up - down;
  var limitUp = ch.filter(function (c) { return c >= 9.8; }).length;
  var limitDown = ch.filter(function (c) { return c <= -9.8; }).length;
  var avg = ch.length ? ch.reduce(function (a, b) { return a + b; }, 0) / ch.length : 0;
  var amt = act.reduce(function (s, q) { return s + q.amount; }, 0);
  var breadth = ch.length ? (up - down) / ch.length : 0;
  var sentiment = Math.round(clamp(50 + breadth * 45 + clamp(avg * 3, -20, 20) + clamp((limitUp - limitDown) * 0.15, -12, 12), 0, 100));

  var defs = [
    ["≤-7", "var(--green)"], ["-7~-5", "var(--green)"], ["-5~-3", "var(--green)"],
    ["-3~-1", "var(--green)"], ["-1~0", "var(--green)"], ["0", "var(--sub)"],
    ["0~1", "var(--red)"], ["1~3", "var(--red)"], ["3~5", "var(--red)"],
    ["5~7", "var(--red)"], ["≥7", "var(--red)"]
  ];
  var buckets = defs.map(function (d) {
    var lbl = d[0];
    var cnt = ch.filter(function (c) {
      if (lbl === "0") return c === 0;
      if (lbl === "≤-7") return c < 0 && c <= -7;
      if (lbl === "-7~-5") return c > -7 && c <= -5;
      if (lbl === "-5~-3") return c > -5 && c <= -3;
      if (lbl === "-3~-1") return c > -3 && c <= -1;
      if (lbl === "-1~0") return c > -1 && c < 0;
      if (lbl === "0~1") return c > 0 && c <= 1;
      if (lbl === "1~3") return c > 1 && c <= 3;
      if (lbl === "3~5") return c > 3 && c <= 5;
      if (lbl === "5~7") return c > 5 && c <= 7;
      if (lbl === "≥7") return c > 7;
      return false;
    }).length;
    return { lbl: lbl, count: cnt, color: d[1] };
  });

  var im = {};
  act.forEach(function (q) {
    var k = q.industry || "";
    if (!k) return;
    var e = im[k] || (im[k] = { sum: 0, count: 0, amount: 0, inflow: 0 });
    e.sum += q.changePct; e.count++; e.amount += q.amount; e.inflow += q.mainNetInflow;
  });
  var inds = Object.keys(im).filter(function (k) { return im[k].count >= 3; }).map(function (k) {
    return { name: k, avgChange: im[k].sum / im[k].count, count: im[k].count, amount: im[k].amount, inflow: im[k].inflow };
  }).sort(function (a, b) { return b.avgChange - a.avgChange; });

  return {
    updatedAt: Date.now(), count: act.length, up: up, down: down, flat: flat,
    limitUp: limitUp, limitDown: limitDown, avgChange: avg, medianChange: median(ch),
    totalAmount: amt, sentiment: sentiment,
    topGainers: act.slice().sort(function (a, b) { return b.changePct - a.changePct; }).slice(0, 10),
    topLosers: act.slice().sort(function (a, b) { return a.changePct - b.changePct; }).slice(0, 10),
    industries: inds, buckets: buckets
  };
}

function capitalFlow(quotes) {
  var act = quotes.filter(function (q) { return q.price > 0 && q.amount > 0 && q.mainNetInflow !== 0; });
  if (!act.length) return null;
  return {
    inflow: act.slice().sort(function (a, b) { return b.mainNetInflow - a.mainNetInflow; }).slice(0, 10),
    outflow: act.slice().sort(function (a, b) { return a.mainNetInflow - b.mainNetInflow; }).slice(0, 10)
  };
}

/* ============================================================
   技术指标
   ============================================================ */
function maAt(closes, i, period) {
  if (i < period - 1) return null;
  var s = 0;
  for (var k = i - period + 1; k <= i; k++) s += closes[k];
  return s / period;
}
function countLimitUps(k) {
  var c = 0;
  for (var i = 0; i < k.length; i++) if (k[i].changePct >= 9.5) c++;
  return c;
}
function computeMetrics(k) {
  var closes = k.map(function (x) { return x.close; });
  var n = closes.length, last = n - 1;
  var ma5 = maAt(closes, last, 5) || 0, ma10 = maAt(closes, last, 10) || 0;
  var ma20 = maAt(closes, last, 20) || 0, ma60 = maAt(closes, last, 60) || 0;
  var ma20Prev = maAt(closes, Math.max(0, last - 5), 20) || ma20;
  var ma20Slope = ma20Prev ? ((ma20 - ma20Prev) / ma20Prev) * 100 : 0;
  var c0 = closes[last] || 0;
  var r5 = (n > 6 && closes[last - 5]) ? ((c0 - closes[last - 5]) / closes[last - 5]) * 100 : 0;
  var r20 = (n > 21 && closes[last - 20]) ? ((c0 - closes[last - 20]) / closes[last - 20]) * 100 : 0;
  var r60 = (n > 61 && closes[last - 60]) ? ((c0 - closes[last - 60]) / closes[last - 60]) * 100 : 0;
  var upDays = 0;
  for (var i = last; i > 0; i--) { if (k[i].close >= k[i - 1].close) upDays++; else break; }
  var slice20 = closes.slice(-20), slice60 = closes.slice(-60);
  var rets = [];
  for (var j = 1; j < slice20.length; j++) rets.push((slice20[j] - slice20[j - 1]) / slice20[j - 1]);
  var vol = rets.length ? std(rets) * Math.sqrt(252) * 100 : 0;
  var peak = -1e18, mdd = 0;
  slice60.forEach(function (c) {
    if (c > peak) peak = c;
    if (peak > 0) mdd = Math.max(mdd, (peak - c) / peak * 100);
  });
  return {
    ma5: ma5, ma10: ma10, ma20: ma20, ma60: ma60, ma20Slope: ma20Slope,
    r5: r5, r20: r20, r60: r60, upDays: upDays,
    max60: slice60.length ? Math.max.apply(null, slice60) : c0,
    min60: slice60.length ? Math.min.apply(null, slice60) : c0,
    volatility: vol, maxDrawdown: mdd,
    limitUps: countLimitUps(k.slice(-20))
  };
}

/* ============================================================
   短线评分
   ============================================================ */
function dayScore(q, k, industryChange, stratKey) {
  var m = computeMetrics(k);
  var cp = q.high > q.low ? (q.price - q.low) / (q.high - q.low) : 0.5;
  var chg = q.changePct;
  var s = 0, tags = [];
  var W = {
    limitup:  { chg: 20, pos: 16, vol: 12, turn: 6, cap: 12, lu: 16, ma: 10, ind: 8 },
    capital:  { chg: 12, pos: 10, vol: 12, turn: 4, cap: 26, lu: 6,  ma: 10, ind: 10 },
    pullback: { chg: 8,  pos: 14, vol: 10, turn: 4, cap: 10, lu: 4,  ma: 18, ind: 8 },
    breakout: { chg: 14, pos: 14, vol: 16, turn: 4, cap: 10, lu: 6,  ma: 18, ind: 8 }
  }[stratKey] || { chg: 20, pos: 16, vol: 12, turn: 6, cap: 12, lu: 16, ma: 10, ind: 8 };

  var chgScore;
  if (stratKey === "pullback") {
    chgScore = (chg >= -3 && chg <= 1.5) ? 1 : (chg > 1.5 && chg <= 5) ? 0.55 : 0.15;
  } else if (stratKey === "capital") {
    chgScore = (chg >= 0.5 && chg <= 7) ? 1 : (chg > 7 && chg < 9.5) ? 0.6 : 0.2;
  } else {
    chgScore = (chg >= 2 && chg <= 6.5) ? 1 : (chg > 0 && chg < 2) ? 0.5 : (chg > 6.5 && chg < 9.5) ? 0.35 : 0.1;
  }
  s += W.chg * chgScore;
  s += W.pos * (cp >= 0.85 ? 1 : cp >= 0.7 ? 0.8 : cp >= 0.5 ? 0.5 : 0.15);
  var vr = q.volumeRatio || 0;
  s += W.vol * ((vr >= 1.4 && vr <= 4.2) ? 1 : vr > 4.2 ? 0.55 : vr > 0 ? 0.35 : 0.25);
  var to = q.turnover || 0;
  s += W.turn * ((to >= 4 && to <= 16) ? 1 : to > 16 ? 0.5 : 0.3);
  s += W.cap * clamp(((q.mainNetRatio || 0) + 3) / 13, 0, 1);
  s += W.lu * clamp(m.limitUps / 4, 0, 1);

  var maScore;
  if (stratKey === "pullback") {
    var nearMa10 = m.ma10 > 0 ? Math.abs(q.price - m.ma10) / m.ma10 : 1;
    var nearMa20 = m.ma20 > 0 ? Math.abs(q.price - m.ma20) / m.ma20 : 1;
    var touching = Math.min(nearMa10, nearMa20) < 0.025;
    maScore = touching ? 1 : (q.price > m.ma20 ? 0.7 : 0.2);
  } else {
    maScore = (m.ma5 > m.ma10 && m.ma10 > m.ma20) ? 1 : (m.ma5 > m.ma20) ? 0.6 : 0.25;
  }
  s += W.ma * maScore;
  s += W.ind * clamp((industryChange + 1) / 5, 0, 1);
  s = clamp(Math.round(s), 0, 100);

  if (m.limitUps >= 1) tags.push("涨停基因×" + m.limitUps);
  if (cp >= 0.85) tags.push("尾盘抢筹");
  if (vr >= 1.4) tags.push("放量");
  if ((q.mainNetRatio || 0) >= 5) tags.push("主力净流入");
  if (m.ma5 > m.ma10 && m.ma10 > m.ma20) tags.push("多头排列");
  if (industryChange >= 2) tags.push("风口");
  if (stratKey === "pullback" && m.ma20 > 0 && q.price >= m.ma20 * 0.99 && q.price <= m.ma20 * 1.03) tags.push("回踩MA20");
  if (stratKey === "breakout" && m.max60 > 0 && q.price / m.max60 > 0.97) tags.push("逼近新高");

  return { quote: q, score: s, tags: tags, metrics: m, closePosition: cp, klines: k };
}

function preRank(qs, st) {
  var arr = qs.map(function (q) {
    var cp = q.high > q.low ? (q.price - q.low) / (q.high - q.low) : 0.5;
    var s = 0;
    if (q.changePct >= 2 && q.changePct <= 6.5) s += 8;
    else if (q.changePct > 0) s += 3;
    else s -= 4;
    s += cp >= 0.8 ? 6 : cp >= 0.6 ? 3 : 0;
    s += Math.max(0, Math.min(q.volumeRatio || 0, 5)) * 2;
    s += Math.max(-8, Math.min(q.mainNetRatio || 0, 15)) * 1.2;
    s += Math.min(q.turnover || 0, 15) * 0.3;
    s += q.amount > 0 ? Math.min(Math.log10(q.amount) - 8, 2) * 3 : 0;
    return { q: q, s: s };
  });
  arr.sort(function (a, b) { return b.s - a.s; });
  return arr.slice(0, Math.max(10, st.candidateCount)).map(function (x) { return x.q; });
}

/* ============================================================
   回测
   ============================================================ */
function backtestDay(klines) {
  var k = klines, rets = [];
  for (var i = 1; i < k.length - 2; i++) {
    var b = k[i], prev = k[i - 1];
    if (!prev.close) continue;
    var chg = (b.close - prev.close) / prev.close * 100;
    var cp = b.high > b.low ? (b.close - b.low) / (b.high - b.low) : 0.5;
    if (chg >= 2 && chg <= 6.5 && cp >= 0.75) {
      var buy = k[i + 1].open > 0 ? k[i + 1].open : b.close;
      var sell = k[i + 2].close;
      if (buy > 0 && sell > 0) rets.push((sell - buy) / buy * 100);
    }
  }
  if (!rets.length) return null;
  var wins = rets.filter(function (r) { return r > 0; }).length;
  var avg = rets.reduce(function (a, b) { return a + b; }, 0) / rets.length;
  var eq = 1, peak = 1, mdd = 0;
  rets.forEach(function (r) {
    eq *= (1 + r / 100);
    if (eq > peak) peak = eq;
    mdd = Math.max(mdd, (peak - eq) / peak * 100);
  });
  return {
    trades: rets.length, winRate: wins / rets.length * 100, avgRet: avg,
    totalRet: (eq - 1) * 100, maxDD: mdd,
    best: Math.max.apply(null, rets), worst: Math.min.apply(null, rets)
  };
}

/* ============================================================
   扫描
   ============================================================ */
async function runDayScan(st, onP) {
  if (onP) onP("拉取全市场行情…", 0, 0);
  var quotes = await fetchSnapshot(function (l, t) {
    if (onP) onP("拉取行情 " + l + "/" + t, l, t);
  }, true);
  if (!quotes.length) throw new Error("行情获取失败");

  var pulse = buildPulse(quotes);

  // 大盘基准：优先上证指数，失败用全市场平均涨幅
  var benchmark = pulse.avgChange;
  try {
    var idx = await fetchQuotes([{ market: 1, code: "000001" }]);
    if (idx[0] && isFinite(idx[0].changePct)) benchmark = idx[0].changePct;
  } catch (e) {}

  var filtered;
  if (st.strictMode) {
    if (onP) onP("严格尾盘 8 规则过滤中…", 0, quotes.length);
    filtered = quotes.filter(function (q) {
      if (st.excludeST && isST(q.name)) return false;
      return strictFilter(q, benchmark);
    });
  } else {
    filtered = quotes.filter(function (q) {
      if (!q.code || !q.name) return false;
      if (q.price <= 0) return false;
      if (st.excludeST && isST(q.name)) return false;
      if (q.name.indexOf("退") >= 0) return false;
      if (st.excludeLimit && (q.changePct >= 9.5 || q.changePct <= -9.5)) return false;
      if (q.floatCap > 0 && q.floatCap < st.minFloatCap * 1e8) return false;
      if (q.amount < st.minAmount * 1e8) return false;
      return true;
    });
  }
  var finalize = function (picks, note) {
    var plan = { picks: picks || [], pulse: pulse, updatedAt: Date.now(), strategy: st.strategy, source: SNAP.source, strictMode: !!st.strictMode, benchmark: benchmark, note: note || "" };
    state.plan = plan;
    state.pulse = pulse;
    state.flow = capitalFlow(quotes);
    state.quotes = quotes;
    save("aip_plan", plan);
    save("aip_pulse", pulse);
    if (state.flow) save("aip_flow", state.flow);
    return plan;
  };

  if (!filtered.length) {
    if (st.strictMode) {
      var btxt = isFinite(benchmark) ? (benchmark >= 0 ? "+" : "") + benchmark.toFixed(2) + "%" : "--";
      return finalize([], "今日大盘 " + btxt + "，严格尾盘 8 规则无一标的全部满足（主板 3-5% + 量比≥1 + 换手5-10% + 市值50-200亿 + 站上均价 + 强于大盘 + 近20日有涨停），弱势日空仓属正常，请 14:30–15:00 再看。");
    }
    throw new Error("过滤后无符合条件的股票，请放宽条件");
  }

  var indMap = {};
  pulse.industries.forEach(function (x) { indMap[x.name] = x.avgChange; });

  // 严格模式候选较少，直接全部拉 K 线；否则预排序取候选
  var cands;
  if (st.strictMode) {
    cands = filtered.slice(0, 120);
  } else {
    cands = preRank(filtered, st);
  }
  if (onP) onP("补全量比、主力资金与行业…", 0, cands.length);
  await enrich(cands);

  // 规则4：量比≥1（新浪源无量比，需东财补全后再过滤）
  if (st.strictMode) {
    cands = cands.filter(function (q) { return (q.volumeRatio || 0) >= 1; });
  }

  if (onP) onP("获取日线并评分…", 0, cands.length);
  var done = 0, scored = [];
  for (var i = 0; i < cands.length; i += 5) {
    var batch = cands.slice(i, i + 5);
    var rs = await Promise.all(batch.map(async function (quote) {
      var k = [];
      try { k = await fetchKlines(quote.market, quote.code, 120); } catch (e) {}
      done++;
      if (onP) onP("评分中 " + done + "/" + cands.length, done, cands.length);
      if (k.length < 25) return null;
      var m = computeMetrics(k);
      // 规则3：近20日必须有涨停
      if (st.strictMode && m.limitUps < 1) return null;
      var pick = dayScore(quote, k, indMap[quote.industry] || 0, st.strategy);
      pick.targetPrice = r2(quote.price * (1 + st.targetPct / 100));
      pick.stopPrice = r2(quote.price * (1 - st.stopPct / 100));
      pick.targetPct = st.targetPct;
      pick.stopPct = st.stopPct;
      pick.backtest = backtestDay(k);
      if (st.strictMode) pick.tags = strictRuleTags(quote, benchmark, m.limitUps);
      return pick;
    }));
    rs.forEach(function (s) { if (s) scored.push(s); });
  }
  if (!scored.length) {
    if (st.strictMode) return finalize([], "今日无近 20 日有涨停的候选（其余规则已过），弱势日空仓属正常，请 14:30–15:00 再看。");
    throw new Error("候选股日线不足，请重试");
  }

  scored.sort(function (a, b) { return b.score - a.score; });
  return finalize(scored.slice(0, 12), "");
}

/* ============================================================
   图表
   ============================================================ */
function lineChart(klines, height) {
  height = height || 132;
  var closes = klines.map(function (k) { return k.close; });
  var n = closes.length;
  if (n < 2) return '<div class="hint">数据不足</div>';
  var W = 340, H = height, pad = 4;
  var all = closes.slice();
  var ma5 = [], ma20 = [];
  for (var i = 0; i < n; i++) { ma5.push(maAt(closes, i, 5)); ma20.push(maAt(closes, i, 20)); }
  ma5.forEach(function (v) { if (v) all.push(v); });
  ma20.forEach(function (v) { if (v) all.push(v); });
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  var rng = (mx - mn) || 1;
  function px(i) { return pad + (i / (n - 1)) * (W - pad * 2); }
  function py(v) { return pad + (1 - (v - mn) / rng) * (H - pad * 2); }
  function poly(arr) {
    var pts = [];
    for (var i = 0; i < arr.length; i++) if (arr[i]) pts.push(px(i).toFixed(1) + "," + py(arr[i]).toFixed(1));
    return pts.join(" ");
  }
  var up = closes[n - 1] >= closes[n - 2];
  var stroke = up ? "var(--red)" : "var(--green)";
  var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">';
  s += '<defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + stroke + '" stop-opacity=".22"/>'
    + '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0"/>'
    + "</linearGradient></defs>";
  s += '<polygon points="' + poly(closes) + " " + px(n - 1).toFixed(1) + "," + (H - pad) + " " + px(0).toFixed(1) + "," + (H - pad) + '" fill="url(#gArea)"/>';
  s += '<polyline points="' + poly(ma20) + '" fill="none" stroke="var(--purple)" stroke-width="1" opacity=".8"/>';
  s += '<polyline points="' + poly(ma5) + '" fill="none" stroke="var(--orange)" stroke-width="1" opacity=".85"/>';
  s += '<polyline points="' + poly(closes) + '" fill="none" stroke="' + stroke + '" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>';
  s += "</svg>";
  s += '<div style="display:flex;gap:12px;font-size:10.5px;color:var(--sub);margin-top:4px">'
    + '<span><i style="display:inline-block;width:10px;height:2px;background:' + stroke + ';vertical-align:middle"></i> 收盘</span>'
    + '<span><i style="display:inline-block;width:10px;height:2px;background:var(--orange);vertical-align:middle"></i> MA5</span>'
    + '<span><i style="display:inline-block;width:10px;height:2px;background:var(--purple);vertical-align:middle"></i> MA20</span>'
    + '<span style="margin-left:auto">' + klines[0].date.slice(5) + " ~ " + klines[n - 1].date.slice(5) + "</span></div>";
  return s;
}

function equityChart(history) {
  if (!history || history.length < 2) return "";
  var W = 340, H = 104, pad = 4;
  var vals = history.map(function (p) { return p.equity; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var rng = (mx - mn) || 1;
  var pts = vals.map(function (v, i) {
    return (pad + (i / (vals.length - 1)) * (W - pad * 2)).toFixed(1) + "," +
      (pad + (1 - (v - mn) / rng) * (H - pad * 2)).toFixed(1);
  }).join(" ");
  var up = vals[vals.length - 1] >= vals[0];
  var stroke = up ? "var(--red)" : "var(--green)";
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">'
    + '<defs><linearGradient id="gEq" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + stroke + '" stop-opacity=".2"/>'
    + '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0"/></linearGradient></defs>'
    + '<polygon points="' + pts + " " + (W - pad) + "," + (H - pad) + " " + pad + "," + (H - pad) + '" fill="url(#gEq)"/>'
    + '<polyline points="' + pts + '" fill="none" stroke="' + stroke + '" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

   模拟盘
   ============================================================ */
function positionValue(p, px) { return (px > 0 ? px : p.buyPrice) * p.shares; }
function accountEquity(a, priceMap) {
  var v = a.cash;
  (a.positions || []).forEach(function (p) { v += positionValue(p, (priceMap && priceMap[p.code]) || 0); });
  return v;
}
function accountStats(a, priceMap) {
  var hist = (a.equityHistory && a.equityHistory.length) ? a.equityHistory : [{ date: todayStr(), equity: a.initialCapital }];
  var eq = accountEquity(a, priceMap);
  var total = a.initialCapital > 0 ? (eq - a.initialCapital) / a.initialCapital * 100 : 0;
  var days = Math.max(1, hist.length);
  var ann = (eq > 0 && a.initialCapital > 0 && days > 1) ? (Math.pow(eq / a.initialCapital, 365 / days) - 1) * 100 : 0;
  var peak = -1e18, mdd = 0;
  hist.forEach(function (p) {
    if (p.equity > peak) peak = p.equity;
    if (peak > 0) mdd = Math.max(mdd, (peak - p.equity) / peak * 100);
  });
  var sells = (a.trades || []).filter(function (t) { return t.side === "sell"; });
  var wins = sells.filter(function (t) { return (t.pnlAmount || 0) > 0; }).length;
  var dayRets = [];
  for (var i = 1; i < hist.length; i++) {
    if (hist[i - 1].equity > 0) dayRets.push((hist[i].equity - hist[i - 1].equity) / hist[i - 1].equity);
  }
  var sharpe = 0;
  if (dayRets.length > 1) {
    var avgR = dayRets.reduce(function (x, y) { return x + y; }, 0) / dayRets.length;
    var sd = std(dayRets);
    sharpe = sd > 0 ? (avgR / sd) * Math.sqrt(250) : 0;
  }
  var maxLoseStreak = 0, streak = 0;
  sells.forEach(function (t) {
    if ((t.pnlAmount || 0) <= 0) { streak++; maxLoseStreak = Math.max(maxLoseStreak, streak); }
    else streak = 0;
  });
  var totalPnl = sells.reduce(function (s, t) { return s + (t.pnlAmount || 0); }, 0);
  return {
    equity: eq, cash: a.cash, positionValue: eq - a.cash,
    totalReturnPct: total, annualizedPct: ann, maxDrawdownPct: mdd,
    tradeCount: sells.length, wins: wins, losses: sells.length - wins,
    winRate: sells.length ? wins / sells.length * 100 : 0,
    sharpe: sharpe, maxLoseStreak: maxLoseStreak, totalPnl: totalPnl,
    days: days, holding: (a.positions || []).length
  };
}

async function settleDay(a, st, plan) {
  var today = todayStr();
  var secids = [], seen = {};
  (a.positions || []).forEach(function (p) { secids.push({ market: p.market, code: p.code }); seen[p.code] = 1; });
  var buys = plan ? plan.picks.slice(0, st.maxPositions) : [];
  buys.forEach(function (p) {
    if (!seen[p.quote.code]) { seen[p.quote.code] = 1; secids.push({ market: p.quote.market, code: p.quote.code }); }
  });
  var quotes = await fetchQuotes(secids);
  function priceOf(code) {
    var x = quotes.filter(function (z) { return z.code === code; })[0];
    return (x && x.price > 0) ? x.price : 0;
  }
  var trades = [], cash = a.cash, remaining = [];
  (a.positions || []).forEach(function (p) {
    var px = priceOf(p.code) || p.buyPrice;
    var reason = null;
    if (px >= p.targetPrice) reason = "止盈";
    else if (px <= p.stopPrice) reason = "止损";
    else if (p.buyDate !== today) reason = "时间止损";
    if (reason) {
      var amt = px * p.shares * (1 - st.costPct);
      var pnl = amt - p.cost;
      cash += amt;
      trades.push({ date: today, code: p.code, name: p.name, side: "sell", price: px, shares: p.shares, amount: amt, pnlPct: p.cost > 0 ? pnl / p.cost * 100 : 0, pnlAmount: pnl, reason: reason });
    } else remaining.push(p);
  });
  var positions = remaining.slice();
  var slots = st.maxPositions - positions.length;
  buys.forEach(function (pick) {
    if (slots <= 0) return;
    if (positions.some(function (p) { return p.code === pick.quote.code; })) return;
    var px = priceOf(pick.quote.code) || pick.quote.price;
    var eq = cash + positions.reduce(function (s, p) { return s + positionValue(p, priceOf(p.code) || p.buyPrice); }, 0);
    var budget = eq * st.positionPct / 100;
    if (budget < px * 100) return;
    var shares = Math.floor(budget / (px * 100)) * 100;
    if (shares <= 0) return;
    var cost = px * shares * (1 + st.costPct);
    if (cost > cash) return;
    cash -= cost;
    positions.push({
      code: pick.quote.code, market: pick.quote.market, name: pick.quote.name,
      buyDate: today, buyPrice: px, shares: shares, cost: cost,
      targetPrice: r2(px * (1 + st.targetPct / 100)), stopPrice: r2(px * (1 - st.stopPct / 100))
    });
    trades.push({ date: today, code: pick.quote.code, name: pick.quote.name, side: "buy", price: px, shares: shares, amount: cost, reason: "短线买入" });
    slots--;
  });
  var next = {
    initialCapital: a.initialCapital, cash: cash, positions: positions,
    trades: (a.trades || []).concat(trades),
    equityHistory: (a.equityHistory || []).concat([{ date: today, equity: cash + positions.reduce(function (s, p) { return s + positionValue(p, priceOf(p.code) || p.buyPrice); }, 0) }])
  };
  saveAccount(next);
  return next;
}

function pushEquity(a) {
  var eq = accountEquity(a, null);
  var t = todayStr();
  var h = a.equityHistory || [];
  if (h.length && h[h.length - 1].date === t) h[h.length - 1].equity = eq;
  else h.push({ date: t, equity: eq });
  a.equityHistory = h;
}

/** 模拟盘买入（AI 可直接调用） */
async function paperBuy(code, opts) {
  opts = opts || {};
  code = String(code || "").trim();
  if (!/^\d{6}$/.test(code)) return { error: "股票代码无效，需 6 位数字" };
  var st = loadSettings();
  if (st.tradeWindowEnabled && !inTradeWindow()) return { error: "非交易时段（14:30–15:00）禁止下单，当前 " + tradeWindowText() };
  var a = loadAccount() || resetAccount(st);
  if (a.positions.some(function (p) { return p.code === code; })) return { error: "已持有 " + code };
  if (a.positions.length >= st.maxPositions) return { error: "已达最大持仓数 " + st.maxPositions + " 只，需先卖出" };

  var quotes = await fetchQuotes([{ market: marketOf(code), code: code }]);
  var q = quotes[0];
  if (!q || !(q.price > 0)) return { error: "无法获取 " + code + " 的实时报价" };
  var px = q.price;
  var eq = accountEquity(a, null);
  var pct = opts.positionPct ? clamp(+opts.positionPct, 1, 60) : st.positionPct;
  var budget = eq * pct / 100;
  var shares = Math.floor(budget / (px * 100)) * 100;
  var cost = px * shares * (1 + st.costPct);
  if (shares <= 0 || cost > a.cash) {
    shares = Math.floor(a.cash / (px * 100 * (1 + st.costPct))) * 100;
    cost = px * shares * (1 + st.costPct);
  }
  if (shares <= 0) return { error: "现金不足以买入一手（现价 " + px.toFixed(2) + "）" };

  a.cash -= cost;
  a.positions.push({
    code: code, market: q.market, name: q.name, buyDate: todayStr(), buyPrice: px,
    shares: shares, cost: cost,
    targetPrice: r2(px * (1 + st.targetPct / 100)), stopPrice: r2(px * (1 - st.stopPct / 100))
  });
  a.trades.push({ date: todayStr(), code: code, name: q.name, side: "buy", price: px, shares: shares, amount: cost, reason: "AI 买入" });
  pushEquity(a);
  saveAccount(a);
  log("trade", "买入 " + q.name + "(" + code + ") " + shares + "股 @" + px.toFixed(2) + " 花费" + money(cost));
  return { ok: true, code: code, name: q.name, price: +px.toFixed(2), shares: shares, cost: Math.round(cost), target: r2(px * (1 + st.targetPct / 100)), stop: r2(px * (1 - st.stopPct / 100)), cashLeft: Math.round(a.cash) };
}

/** 模拟盘卖出（AI 可直接调用） */
async function paperSell(code, opts) {
  opts = opts || {};
  code = String(code || "").trim();
  var st = loadSettings();
  if (st.tradeWindowEnabled && !inTradeWindow()) return { error: "非交易时段（14:30–15:00）禁止卖出，当前 " + tradeWindowText() };
  var a = loadAccount();
  if (!a) return { error: "模拟盘尚未初始化" };
  var idx = -1;
  for (var i = 0; i < a.positions.length; i++) if (a.positions[i].code === code) idx = i;
  if (idx < 0) return { error: "未持有 " + code };
  var p = a.positions[idx];
  var quotes = await fetchQuotes([{ market: p.market, code: code }]);
  var q = quotes[0];
  var px = (q && q.price > 0) ? q.price : p.buyPrice;
  var ratio = (opts.ratio !== undefined && isFinite(+opts.ratio)) ? clamp(+opts.ratio, 0.01, 1) : 1;
  var shares = ratio >= 1 ? p.shares : Math.floor(p.shares * ratio / 100) * 100;
  if (shares <= 0) shares = p.shares;
  var amt = px * shares * (1 - st.costPct);
  var costShare = p.cost * (shares / p.shares);
  var pnl = amt - costShare;

  a.cash += amt;
  p.shares -= shares;
  p.cost -= costShare;
  if (p.shares <= 0) a.positions.splice(idx, 1);
  a.trades.push({
    date: todayStr(), code: code, name: p.name, side: "sell", price: px, shares: shares,
    amount: amt, pnlAmount: pnl, pnlPct: costShare > 0 ? pnl / costShare * 100 : 0,
    reason: opts.reason || "AI 卖出"
  });
  pushEquity(a);
  saveAccount(a);
  log("trade", "卖出 " + p.name + "(" + code + ") " + shares + "股 @" + px.toFixed(2) + " 盈亏" + (pnl >= 0 ? "+" : "") + money(pnl));
  return { ok: true, code: code, name: p.name, price: +px.toFixed(2), shares: shares, pnl: Math.round(pnl), pnlPct: +(costShare > 0 ? pnl / costShare * 100 : 0).toFixed(2), cashLeft: Math.round(a.cash) };
}

async function closeAll(a, st) {
  if (!a || !(a.positions || []).length) return a;
  var today = todayStr();
  var quotes = await fetchQuotes(a.positions.map(function (p) { return { market: p.market, code: p.code }; }));
  function priceOf(code) {
    var x = quotes.filter(function (z) { return z.code === code; })[0];
    return (x && x.price > 0) ? x.price : 0;
  }
  var cash = a.cash, trades = [];
  a.positions.forEach(function (p) {
    var px = priceOf(p.code) || p.buyPrice;
    var amt = px * p.shares * (1 - st.costPct);
    var pnl = amt - p.cost;
    cash += amt;
    trades.push({ date: today, code: p.code, name: p.name, side: "sell", price: px, shares: p.shares, amount: amt, pnlPct: p.cost > 0 ? pnl / p.cost * 100 : 0, pnlAmount: pnl, reason: "手动清仓" });
  });
  var next = {
    initialCapital: a.initialCapital, cash: cash, positions: [],
    trades: (a.trades || []).concat(trades),
    equityHistory: (a.equityHistory || []).concat([{ date: today, equity: cash }])
  };
  saveAccount(next);
  return next;
}

    code: q.code, name: q.name, price: +q.price.toFixed(2), chg: +q.changePct.toFixed(2),
    turnover: +(q.turnover || 0).toFixed(2), volRatio: +(q.volumeRatio || 0).toFixed(2),
    mainInflowYi: +((q.mainNetInflow || 0) / 1e8).toFixed(2), mainRatio: +(q.mainNetRatio || 0).toFixed(2),
    industry: q.industry || ""
  };
}

    return { error: String(e && e.message ? e.message : e) };
  }
}

var AGENT_SYSTEM = [
  "你是「AI 选股·短线终端」内置的 A 股短线交易智能体。",
  "你可以调用工具获取真实行情、筛选股票、查询与操作模拟盘。",
  "规则：",
  "1. 所有数字必须来自工具返回，严禁编造或凭记忆给出价格。",
  "2. 需要行情时必须先调用工具，不要向用户索要数据。",
  "3. 买卖前先调用 get_account 确认仓位与现金；买入调用 paper_buy，卖出调用 paper_sell。",
  "4. 严格遵守纪律：单票仓位不超设定比例，总持仓不超上限，达到止盈/止损/隔日到期必须卖出。",
  "5. 最终回答用中文，简洁具体，必须提醒风险，结尾注明不构成投资建议。"
].join("\n");

async function chatWithTools(messages, st) {
  var base = (st.baseUrl || "https://api.deepseek.com").replace(/\/+$/, "");
  var r = await netFetch(base + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (st.key || "") },
    body: JSON.stringify({
      model: st.model || "deepseek-chat",
      messages: messages,
      tools: TOOLS,
      tool_choice: "auto",
      temperature: 0.3,
      max_tokens: 1600
    }),
    timeout: 90000
  });
  var body = await r.text();
  if (!r.ok) throw new Error("HTTP " + r.status + " " + body.slice(0, 160));
  var j;
  try { j = JSON.parse(body); } catch (e) { throw new Error("AI 返回解析失败"); }
  var msg = j && j.choices && j.choices[0] && j.choices[0].message;
  if (!msg) throw new Error("AI 返回为空");
  return msg;
}

async function aiAgent(task, opts) {
  opts = opts || {};
  var st = loadSettings();
  if (!st.key) throw new Error("请先在「设置」填写 API Key");
  var maxRounds = opts.maxRounds || 6;
  log("ai", "任务开始：" + task.split("\n")[0].slice(0, 60));
  var messages = [
    { role: "system", content: AGENT_SYSTEM },
    { role: "user", content: task }
  ];
  var toolCount = 0;
  for (var round = 1; round <= maxRounds; round++) {
    log("ai", "第 " + round + " 轮推理…");
    var msg = await chatWithTools(messages, st);
    var tcs = msg.tool_calls || [];
    if (msg.content && (!tcs.length)) log("ai", "AI 结论：" + String(msg.content).replace(/\n/g, " ").slice(0, 200));
    if (!tcs.length) {
      log("success", "任务完成，共调用工具 " + toolCount + " 次");
      return msg.content || "";
    }
    messages.push({ role: "assistant", content: msg.content || "", tool_calls: tcs });
    for (var i = 0; i < tcs.length; i++) {
      var tc = tcs[i];
      var args = {};
      try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) { args = {}; }
      log("tool", "→ " + tc.function.name + "(" + JSON.stringify(args).slice(0, 90) + ")");
      var out = await runTool(tc.function.name, args);
      toolCount++;
      log(out && out.error ? "warn" : "tool", "← " + tc.function.name + " " + (out && out.error ? out.error : JSON.stringify(out).slice(0, 220)));
      messages.push({ role: "tool", tool_call_id: tc.id, content: JSON.stringify(out).slice(0, 8000) });
      if (state.tab === "paper" || state.tab === "day") render();
    }
  }
  log("warn", "达到最大工具轮数，已停止");
  return "（已达到最大工具调用轮次，请查看日志）";
}

async function refreshWatch() {
  var w = loadWatch();
  var el = document.getElementById("watchList");
  if (!el || !w.length) return;
  var quotes = await fetchQuotes(w.map(function (x) { return { market: x.market, code: x.code }; }));
  var html = "";
  w.forEach(function (item) {
    var q = quotes.filter(function (x) { return x.code === item.code; })[0];
    var px = (q && q.price > 0) ? q.price : item.addPrice;
    var chg = q ? q.changePct : null;
    var pnl = item.addPrice > 0 ? (px - item.addPrice) / item.addPrice * 100 : 0;
    html += '<div class="row">'
      + '<div class="grow click" data-code="' + esc(item.code) + '" data-market="' + item.market + '">'
      + '<div class="nm">' + esc(item.name) + "</div>"
      + '<div class="sub">自选 ' + item.addPrice.toFixed(2) + " · 浮盈 " + pct(pnl) + "</div></div>"
      + '<div class="right click" data-code="' + esc(item.code) + '" data-market="' + item.market + '">'
      + '<div class="num" style="font-weight:700;color:' + chgColor(chg) + '">' + px.toFixed(2) + "</div>"
      + '<div class="sub num" style="color:' + chgColor(chg) + '">' + pct(chg) + "</div></div>"
      + '<button class="btn sm ghost" data-rm="' + esc(item.code) + '">删</button></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll("[data-rm]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      haptic(10);
      saveWatch(loadWatch().filter(function (x) { return x.code !== b.getAttribute("data-rm"); }));
      renderWatch();
      toast("已移除");
    });
  });
  bindDetailClicks(el);
}

async function refreshPositions() {
  var a = loadAccount();
  var el = document.getElementById("posList");
  if (!a || !el) return;
  var quotes = await fetchQuotes(a.positions.map(function (p) { return { market: p.market, code: p.code }; }));
  var html = "";
  a.positions.forEach(function (p) {
    var q = quotes.filter(function (x) { return x.code === p.code; })[0];
    var px = (q && q.price > 0) ? q.price : p.buyPrice;
    var pnl = (px - p.buyPrice) * p.shares;
    var pp = p.buyPrice > 0 ? (px - p.buyPrice) / p.buyPrice * 100 : 0;
    var hitTarget = px >= p.targetPrice, hitStop = px <= p.stopPrice;
    html += '<div class="row click" data-code="' + esc(p.code) + '" data-market="' + p.market + '">'
      + '<div class="grow"><div class="nm">' + esc(p.name) + "</div>"
      + '<div class="sub">' + p.shares + "股 @ " + p.buyPrice.toFixed(2) + " · 现价 " + px.toFixed(2) + "</div>"
      + '<div class="sub">目标 <span class="red">' + p.targetPrice.toFixed(2) + '</span> · 止损 <span class="green">' + p.stopPrice.toFixed(2) + "</span>"
      + (hitTarget ? ' <span class="badge ok">已达止盈</span>' : hitStop ? ' <span class="badge bad">已破止损</span>' : "")
      + "</div></div>"
      + '<div class="right"><div class="num" style="font-weight:750;color:' + chgColor(pnl) + '">' + (pnl >= 0 ? "+" : "") + money(pnl) + "</div>"
      + '<div class="sub num" style="color:' + chgColor(pp) + '">' + pct(pp) + "</div>"
      + '<button class="btn sm ghost" data-copy="' + esc(p.code + " " + p.name + " 卖出 " + p.shares + "股 现价" + px.toFixed(2) + " 目标" + p.targetPrice.toFixed(2) + " 止损" + p.stopPrice.toFixed(2)) + '" style="margin-top:5px;padding:5px 9px;font-size:11px">复制</button></div></div>';
  });
  el.innerHTML = html;
  bindDetailClicks(el);
}

function renderCompound() {
  var out = document.getElementById("cmpOut");
  if (!out) return;
  var rateEl = document.getElementById("inpRate"), daysEl = document.getElementById("inpDays");
  if (!rateEl || !daysEl) return;
  var rate = +rateEl.value, days = +daysEl.value;
  var rv = document.getElementById("cmpRateV"), dv = document.getElementById("cmpDaysV");
  if (rv) rv.textContent = rate.toFixed(1) + "%";
  if (dv) dv.textContent = days;
  var cap = loadSettings().initialCapital;
  var fv = cap * Math.pow(1 + rate / 100, days);
  out.innerHTML = '<div class="sub">' + money(cap) + " × 每日 " + rate.toFixed(1) + "% × " + days + " 天</div>"
    + '<div class="num" style="font-size:23px;font-weight:800;color:var(--red);letter-spacing:-.9px">' + money(fv) + "</div>"
    + '<div class="note" style="margin-top:5px">纯数学复利推演，未考虑亏损日、滑点与手续费。现实无法保证每日正收益。</div>';
}

/* ---------- 设置 ---------- */
function renderSettings() {
  var st = loadSettings();
  function fmt(id, val) {
    if (id === "f_target" || id === "f_stop" || id === "f_pos") return val + "%";
    if (id === "f_max") return val + " 支";
    if (id === "f_amt") return val + " 亿";
    if (id === "f_cand") return val + " 只";
    if (id === "f_cap") return (val / 10000).toFixed(0) + " 万";
    if (id === "f_cost") return "万分之 " + val;
    return String(val);
  }
  function slider(id, title, val, min, max, step) {
    return '<label>' + title + '：<b id="' + id + 'v" style="color:var(--blue)">' + fmt(id, val) + "</b></label>"
      + '<input id="' + id + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">';

  // 底部固定保存条
  html += '<div class="savebar"><button class="btn" id="btnSave">保存设置</button></div>';

  view.innerHTML = html;
  bindAll();

  view.querySelectorAll("[data-theme]").forEach(function (b) {

      haptic(8);
      var t = b.getAttribute("data-theme");
      var s = loadSettings(); s.theme = t; saveSettings(s);
      applyTheme(t); renderSettings();
    });
  });
  ["f_target", "f_stop", "f_max", "f_pos", "f_amt", "f_cand", "f_cap", "f_cost"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("input", function () {
      var v = document.getElementById(id + "v");
      if (v) v.textContent = fmt(id, +el.value);

  var quote = null, klines = [];
