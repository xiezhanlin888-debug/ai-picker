    + '<button class="btn ' + (watched ? "ghost" : "") + '" id="mWatch">' + (watched ? "已自选" : "加自选") + "</button>"
    + '<button class="btn soft" id="mAI">AI 点评</button></div>'
    + '<div class="btns"><button class="btn ghost" id="mCopyCode">复制代码</button>'
    + '<button class="btn ghost" id="mCopyOrder">复制下单文本</button></div>'
    + '<div id="mAIOut" class="sub" style="margin-top:11px;white-space:pre-wrap;line-height:1.7"></div></div>';

  html += '<div class="card"><div class="note">数据来自东方财富 / 新浪财经；AI 由 DeepSeek 生成。仅供研究，不构成投资建议。</div></div>';

  modal.innerHTML = '<div class="mhead"><button class="iconbtn" id="mClose">✕</button>'
    + '<div class="t">' + esc(quote.name) + "</div></div>"
    + '<div class="modal-body">' + html + "</div>";
  document.getElementById("mClose").addEventListener("click", closeModal);
  modal.scrollTop = 0;

  document.getElementById("mWatch").addEventListener("click", function () {
    haptic(10);
    var w = loadWatch();
    if (w.some(function (x) { return x.code === code; })) {
      saveWatch(w.filter(function (x) { return x.code !== code; }));
      toast("已从自选移除");
    } else {
      w.push({ code: code, market: market, name: quote.name, addedAt: Date.now(), addPrice: quote.price });
      saveWatch(w);
      toast("已加入自选");
    }
    openDetail(code, market);
  });

  document.getElementById("mCopyCode").addEventListener("click", function () {
    doCopy(quote.code, "股票代码");
  });
  document.getElementById("mCopyOrder").addEventListener("click", function () {
    var line = quote.code + " " + quote.name + " 现价" + (quote.price > 0 ? quote.price.toFixed(2) : "-");
    if (m) line += " MA5 " + m.ma5.toFixed(2) + " MA20 " + m.ma20.toFixed(2);
    doCopy(line, "下单文本");
  });

  document.getElementById("mAI").addEventListener("click", async function () {
    var st = loadSettings();
    var out = document.getElementById("mAIOut");
    if (!st.key) { out.textContent = "请先在「设置」填写 API Key"; return; }
    out.innerHTML = '<span class="spin"></span> AI 分析中…';
    log("ai", "个股点评 " + quote.name + "(" + quote.code + ")");
    try {
      var txt = await aiChat(buildStockPrompt({ quote: quote, score: 70, tags: [], metrics: m, backtest: bt }), st);
      out.textContent = txt;
      log("success", "个股点评完成 " + quote.code);
    } catch (e) {
      out.textContent = "AI 点评失败：" + (e && e.message ? e.message : String(e));
      log("error", "个股点评失败：" + (e && e.message ? e.message : String(e)));
    }
  });
}

function closeModal() {
  var modal = document.getElementById("modal");
  modal.classList.add("hidden");
  modal.innerHTML = "";
}

/* ============================================================
   搜索
   ============================================================ */
async function openSearch() {
  var modal = document.getElementById("modal");
  modal.classList.remove("hidden");
  modal.innerHTML = '<div class="mhead"><button class="iconbtn" id="mClose">✕</button>'
    + '<div class="t">搜索股票</div></div>'
    + '<div class="modal-body"><input id="inpSearch" placeholder="输入代码或名称，如 600519 / 茅台" autofocus>'
    + '<div id="searchOut" class="hint">输入关键字开始搜索</div></div>';
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("inpSearch").addEventListener("input", function (e) {
    var kw = e.target.value.trim();
    clearTimeout(openSearch._t);
    openSearch._t = setTimeout(function () { doSearch(kw); }, 260);
  });
  async function doSearch(kw) {
    var out = document.getElementById("searchOut");
    if (!out) return;
    if (!kw) { out.className = "hint"; out.textContent = "输入关键字开始搜索"; return; }
    if (!state.quotes) {
      out.className = "sub";
      out.innerHTML = '<span class="spin"></span> 首次搜索需加载全市场数据…';
      try { state.quotes = await fetchSnapshot(); } catch (e) { out.textContent = "加载失败：" + e.message; return; }
    }
    var q = kw.toUpperCase();
    var hits = state.quotes.filter(function (x) {
      return x.code.indexOf(q) >= 0 || x.name.toUpperCase().indexOf(q) >= 0;
    }).slice(0, 40);
    if (!hits.length) { out.className = "hint"; out.textContent = "没有找到匹配的股票"; return; }
    out.className = "";
    out.innerHTML = hits.map(function (x) { return stockRow(x); }).join("");
    bindDetailClicks(out);
  }
}

/* ============================================================
   绑定与动作
   ============================================================ */
function bindDetailClicks(root) {
  (root || view).querySelectorAll("[data-code]").forEach(function (el) {
    if (el.__bound) return;
    el.__bound = true;
    el.addEventListener("click", function () {
      haptic(6);
      openDetail(el.getAttribute("data-code"), +el.getAttribute("data-market"));
    });
  });
}

function bind(id, fn) {
  var b = document.getElementById(id);
  if (b) b.addEventListener("click", function () { haptic(8); fn(); });
}

function bindAll() {
  bindDetailClicks(view);
  view.querySelectorAll("[data-copy]").forEach(function (b) {
    if (b.__bound) return; b.__bound = true;
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      doCopy(b.getAttribute("data-copy"), "下单文本");
    });
  });
  bind("btnScan", doScan);
  bind("btnAgent", doAgentTrade);
  bind("btnOpenLog", function () { state.tab = "log"; render(); });
  bind("btnCopyList", copyBuyList);
  bind("btnLogClear", function () { LOGS.length = 0; renderLog(); toast("日志已清空"); });
  bind("btnLogCopy", function () {
    if (!LOGS.length) { toast("暂无日志"); return; }
    var txt = LOGS.map(function (e) { return logTime(e.t) + " [" + e.level + "] " + e.msg; }).join("\n");
    doCopy(txt, "日志");
  });
  bind("btnAI", doAI);
  bind("btnSettle", doSettle);
  bind("btnRefresh", doRefreshMarket);
  bind("btnInit", function () { resetAccount(loadSettings()); renderPaper(); toast("已初始化"); });
  bind("btnReset", function () {
    if (!confirm("确认重置模拟盘？所有持仓与记录将清空。")) return;
    resetAccount(loadSettings()); renderPaper(); toast("已重置");
  });
  bind("btnClose", async function () {
    var a = loadAccount(); if (!a) return;
    if (!confirm("确认按当前价清空全部持仓？")) return;
    await closeAll(a, loadSettings()); renderPaper(); toast("已清仓");
  });
  bind("btnAdd", addWatch);
  bind("btnSave", saveAllSettings);
  bind("btnTest", testAI);
  bind("btnNet", netSelfTest);
  bind("btnExport", exportData);
  bind("btnClearCache", function () { SNAP = { at: 0, data: null, source: "" }; state.quotes = null; toast("缓存已清空"); });
  bind("btnST", function () { var s = loadSettings(); s.excludeST = !s.excludeST; saveSettings(s); renderSettings(); });
  bind("btnAutoOpen", function () { var s = loadSettings(); s.autoTradeOnOpen = !s.autoTradeOnOpen; saveSettings(s); renderSettings(); });
  bind("btnLimit", function () { var s = loadSettings(); s.excludeLimit = !s.excludeLimit; saveSettings(s); renderSettings(); });
  bind("btnStrict", function () { var s = loadSettings(); s.strictMode = !s.strictMode; saveSettings(s); renderSettings(); });
  bind("btnWindow", function () { var s = loadSettings(); s.tradeWindowEnabled = !s.tradeWindowEnabled; saveSettings(s); renderSettings(); });
  view.querySelectorAll("[data-strat]").forEach(function (b) {
    if (b.__bound) return; b.__bound = true;
    b.addEventListener("click", function () {
      haptic(8);
      var s = loadSettings(); s.strategy = b.getAttribute("data-strat");
      saveSettings(s); renderDay();
    });
  });
}

async function doScan() {
  if (state.scanning) return;
  state.scanning = true; renderDay();
  try {
    var st = loadSettings();
    await runDayScan(st, function (msg, cur, total) {
      state.progText = msg; state.progCur = cur; state.progTotal = total;
      var bar = document.querySelector(".progress > div");
      var txt = document.querySelector(".card .sub");
      if (bar && total > 0) bar.style.width = Math.round(cur / total * 100) + "%";
      if (txt) txt.textContent = msg;
    });
    if (state.plan && state.plan.note && !state.plan.picks.length) {
      toast("今日无符合标的");
      log("warn", state.plan.note);
    } else {
      toast("扫描完成 · " + state.plan.picks.length + " 只入选");
    }
  } catch (e) {
    var msg = (e && e.message ? e.message : String(e));
    log("error", "扫描失败：" + msg);
    toast("扫描失败：" + msg);
  }
  state.scanning = false;
  renderDay();
}

async function doAI() {
  var st = loadSettings();
  if (!st.key) { toast("请先在「设置」填写 API Key"); return; }
  state.aiLoading = true; renderDay();
  try {
    if (!state.pulse) {
      var q = await fetchSnapshot();
      state.pulse = buildPulse(q);
      state.flow = capitalFlow(q);
      save("aip_pulse", state.pulse);
      if (state.flow) save("aip_flow", state.flow);
    }
    var f = state.flow || { inflow: [], outflow: [] };
    state.aiText = await aiChat(buildMarketPrompt(state.pulse, state.plan, f.inflow, f.outflow), st);
  } catch (e) {
    state.aiText = "AI 研判失败：" + (e && e.message ? e.message : String(e));
  }
  state.aiLoading = false;
  renderDay();
}

async function doAgentTrade() {
  if (state.agentRunning) return;
  var st = loadSettings();
  if (!st.key) { toast("请先在「设置」填写 API Key"); return; }
  if (st.tradeWindowEnabled && !inTradeWindow()) {
    var msg = "当前 " + tradeWindowText() + "，不在交易时段（14:30–15:00），已停止自动交易。";
    state.agentOut = msg;
    log("warn", msg);
    toast(msg);
    renderDay();
    return;
  }
  state.agentRunning = true;
  state.agentOut = null;
  log("ai", "===== AI 全自动交易开始 =====");
  renderDay();
  try {
    var out = await aiAgent(buildAutoTradeTask(), { maxRounds: 8 });
    state.agentOut = out || "（AI 未返回结论）";
    var d = todayStr();
    state.lastAutoDate = d;
    save("aip_last_auto", d);
    log("success", "===== AI 全自动交易结束 =====");
    toast("AI 交易完成");
  } catch (e) {
    state.agentOut = "执行失败：" + (e && e.message ? e.message : String(e));
    log("error", state.agentOut);
    toast("AI 交易失败");
  }
  state.agentRunning = false;
  renderDay();
}

function copyBuyList() {
  if (!state.plan || !state.plan.picks.length) { toast("暂无买入计划"); return; }
  var lines = state.plan.picks.slice(0, 5).map(function (p) { return pickCopyText(p); });
  doCopy(lines.join("\n"), "买入清单");
}

async function doSettle() {
  if (state.settling) return;
  var st = loadSettings();
  if (st.tradeWindowEnabled && !inTradeWindow()) {
    toast("当前 " + tradeWindowText() + "，不在交易时段，已停止结算");
    log("warn", "结算被时段闸门拦截：" + tradeWindowText());
    return;
  }
  state.settling = true; renderDay();
  try {
    var a = loadAccount() || resetAccount(loadSettings());
    await settleDay(a, loadSettings(), state.plan);
    toast("结算完成");
  } catch (e) {
    alert("结算失败：" + (e && e.message ? e.message : String(e)));
  }
  state.settling = false;
  renderDay();
}

async function doRefreshMarket() {
  toast("刷新中…");
  try {
    var q = await fetchSnapshot(null, true);
    state.quotes = q;
    state.pulse = buildPulse(q);
    state.flow = capitalFlow(q);
    save("aip_pulse", state.pulse);
    if (state.flow) save("aip_flow", state.flow);
    try {
      state.indices = await fetchQuotes(INDICES.map(function (x) { return { market: x.market, code: x.code }; }));
    } catch (e) {}
    renderMarket();
    toast("已刷新 · " + (state.source || ""));
  } catch (e) {
    toast("刷新失败：" + (e && e.message ? e.message : String(e)));
  }
}

async function addWatch() {
  var input = document.getElementById("inpCode");
  if (!input) return;
  var kw = input.value.trim();
  if (!kw) { toast("请输入代码或名称"); return; }
  var hits = [];
  if (/^\d{6}$/.test(kw)) {
    hits = await fetchQuotes([{ market: marketOf(kw), code: kw }]);
    if (!hits.length) hits = await fetchQuotes([{ market: 1 - marketOf(kw), code: kw }]);
  } else {
    if (!state.quotes) { try { state.quotes = await fetchSnapshot(); } catch (e) {} }
    if (state.quotes) hits = state.quotes.filter(function (x) { return x.name.indexOf(kw) >= 0; }).slice(0, 1);
  }
  if (!hits.length) { toast("未找到该股票"); return; }
  var q = hits[0];
  var w = loadWatch();
  if (w.some(function (x) { return x.code === q.code; })) { toast("已在自选中"); return; }
  w.push({ code: q.code, market: q.market, name: q.name, addedAt: Date.now(), addPrice: q.price });
  saveWatch(w);
  input.value = "";
  renderWatch();
  toast("已添加 " + q.name);
}

function saveAllSettings() {
  var st = loadSettings();
  function g(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
  st.baseUrl = g("f_baseUrl") || "https://api.deepseek.com";
  st.model = g("f_model") || "deepseek-chat";
  st.key = g("f_key");
  st.targetPct = +g("f_target");
  st.stopPct = +g("f_stop");
  st.maxPositions = +g("f_max");
  st.positionPct = +g("f_pos");
  st.minAmount = +g("f_amt");
  st.candidateCount = +g("f_cand");
  st.initialCapital = +g("f_cap");
  st.costPct = (+g("f_cost")) / 10000;
  saveSettings(st);
  toast("设置已保存");
}

async function testAI() {
  var st = loadSettings();
  function g(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
  st.baseUrl = g("f_baseUrl") || st.baseUrl;
  st.model = g("f_model") || st.model;
  st.key = g("f_key") || st.key;
  var out = document.getElementById("testOut");
  if (out) out.innerHTML = '<span class="spin"></span> 测试中…';
  try {
    var r = await aiChat("请只回复四个字：连接成功。", st);
    if (out) out.textContent = "✓ 连接成功：" + r.slice(0, 40);
  } catch (e) {
    if (out) out.textContent = "✗ " + (e && e.message ? e.message : String(e));
  }
}

async function netSelfTest() {
  var out = document.getElementById("netOut");
  if (!out) return;
  out.innerHTML = '<span class="spin"></span> 逐项检测中（约 15 秒）…';
  var lines = [];
  function add(t) { lines.push(t); out.innerHTML = lines.map(function (l) { return "<div style='margin:3px 0'>" + esc(l) + "</div>"; }).join(""); }

  add("环境：" + (NATIVE_HTTP ? "原生 HTTP" : "浏览器") + (canJsonp() ? " · JSONP 可用" : " · JSONP 不可用"));

  // 1) JSONP 通道
  if (canJsonp()) {
    try {
      var t1 = Date.now();
      var a = await jsonpGet(SINA_JSONP + "?page=1&num=20&sort=symbol&asc=1&node=hs_a&symbol=&_s_r_a=page", true, 12000);
      add("新浪 JSONP：" + (Array.isArray(a) && a.length ? "✓ " + a.length + " 条 · " + (Date.now() - t1) + "ms" : "✗ 空数据"));
    } catch (e) { add("新浪 JSONP：✗ " + (e && e.message ? e.message : e)); }
    try {
      var b = await jsonpGet(EM_ULIST + "?fltt=2&invt=2&secids=1.600519&fields=f2,f3,f12,f14", false, 12000);
      add("东财 JSONP：" + (b && b.data ? "✓ 正常" : "✗ 异常"));
    } catch (e) { add("东财 JSONP：✗ " + (e && e.message ? e.message : e)); }
  }

  // 2) fetch 通道（仅作兵底，失败属正常）
  var fetchOk = false;
  NET_QUIET = true;
  try {
    var t2 = Date.now();
    var r = await netFetch(SINA_LIST + "?page=1&num=100&sort=symbol&asc=1&node=hs_a&symbol=&_s_r_a=page", { timeout: 12000 });
    var txt = await r.text();
    if (txt && txt.length > 1000) { fetchOk = true; add("新浪 fetch：○ " + txt.length + "B · " + (Date.now() - t2) + "ms（兵底可用）"); }
    else add("新浪 fetch：○ 空响应（不影响，JSONP 已承担）");
  } catch (e) { add("新浪 fetch：○ 被 CORS 拦（正常，JSONP 已承担取数）"); }
  NET_QUIET = false;

  // 3) 整体快照
  try {
    var t3 = Date.now();
    var q = await fetchSnapshot(null, true);
    var mark = q.length > 4000 ? "✓" : (q.length > 1000 ? "○" : "⚠");
    add("全市场快照：" + mark + " " + q.length + " 只 · 源 " + (state.source || "?") + " · " + (Date.now() - t3) + "ms");
  } catch (e) { add("全市场快照：✗ " + (e && e.message ? e.message : String(e))); }

  // 4) K 线
  try {
    var k = await fetchKlines(1, "600519", 5);
    add("K线：" + (k.length ? "✓ " + k.length + " 根" : "✗ 空"));
  } catch (e) { add("K线：✗ " + (e && e.message ? e.message : String(e))); }

  // 5) AI
  var st = loadSettings();
  if (!st.key) add("AI 接口：⚠ 未填写 Key（去「设置 → AI 引擎」填 DeepSeek Key）");
  else {
    try { var s = await aiChat("只回复两个字：正常", st); add("AI 接口：✓ " + s.slice(0, 20)); }
    catch (e) { add("AI 接口：✗ " + (e && e.message ? e.message : String(e))); }
  }
  if (NET_LOG.length) add("最近错误：" + NET_LOG.slice(-2).join(" ｜ "));

  // 结论
  var snapOk = false;
  try { snapOk = state.quotes && state.quotes.length > 1000; } catch (e) {}
  add("———");
  if (snapOk) add("结论：✓ 行情链路正常（JSONP）" + (st.key ? " · AI 已配置" : " · 仅差 AI Key"));
  else add("结论：✗ 行情未拉通，请看上面哪一项是 ✗");
}

function exportData() {
  var data = { exportedAt: new Date().toISOString(), settings: loadSettings(), account: loadAccount(), watchlist: loadWatch(), plan: state.plan };
  var txt = JSON.stringify(data, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast("已复制到剪贴板"); }).catch(function () { toast("复制失败"); });
  } else toast("当前环境不支持复制");
}

/* ============================================================
   路由与启动
   ============================================================ */
function render() {
  var titles = { day: "短线终端", market: "市场行情", watch: "我的自选", paper: "模拟盘", log: "实时日志", settings: "设置" };
  var sub = document.getElementById("subTitle");
  if (sub) sub.textContent = titles[state.tab] || "";
  if (state.tab === "day") renderDay();
  else if (state.tab === "market") renderMarket();
  else if (state.tab === "watch") renderWatch();
  else if (state.tab === "paper") renderPaper();
  else if (state.tab === "log") renderLog();
  else renderSettings();
  document.querySelectorAll(".tabbar button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tab") === state.tab);
  });
  window.scrollTo(0, 0);
}

document.querySelectorAll(".tabbar button").forEach(function (b) {
  b.addEventListener("click", function () {
    if (state.tab === b.getAttribute("data-tab")) return;
    haptic(8);
    state.tab = b.getAttribute("data-tab");
    render();
  });
});

document.getElementById("btnSearch").addEventListener("click", function () { haptic(8); openSearch(); });
document.getElementById("btnTheme").addEventListener("click", function () {
  haptic(8);
  var s = loadSettings();
  var order = ["auto", "light", "dark"];
  s.theme = order[(order.indexOf(s.theme) + 1) % order.length];
  saveSettings(s);
  applyTheme(s.theme);
  toast(s.theme === "auto" ? "跟随系统" : s.theme === "light" ? "日间模式" : "夜间模式");
});

(function boot() {
  var s = loadSettings();
  applyTheme(s.theme);
  state.plan = load("aip_plan", null);
  state.pulse = load("aip_pulse", null);
  state.flow = load("aip_flow", null);
  state.lastAutoDate = load("aip_last_auto", "");
  log("info", "App 启动 · v4.0 · 网络 " + (NATIVE_HTTP ? "原生HTTP" : "fetch") + " · 数据源待探测");
  render();

  fetchSnapshot().then(function (q) {
    state.quotes = q;
    state.pulse = buildPulse(q);
    state.flow = capitalFlow(q);
    save("aip_pulse", state.pulse);
    if (state.flow) save("aip_flow", state.flow);
    log("success", "行情就绪：" + q.length + " 只 · 源 " + (state.source || "?"));
    if (state.tab === "market") renderMarket();
  }).catch(function (e) { logNet("启动拉取失败：" + (e && e.message ? e.message : e)); log("error", "行情拉取失败：" + (e && e.message ? e.message : e)); });

  fetchQuotes(INDICES.map(function (x) { return { market: x.market, code: x.code }; }))
    .then(function (qs) {
      if (!qs.length) return;
      state.indices = INDICES.map(function (ind, i) {
        var found = qs.filter(function (q) { return q.code === ind.code; })[0];
        return found ? { code: ind.code, name: ind.name, price: found.price, changePct: found.changePct } : null;
      }).filter(Boolean);
      if (state.tab === "market") renderMarket();
    }).catch(function () {});

  try {
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (loadSettings().theme === "auto") applyTheme("auto");
      });
    }
  } catch (e) {}

  // 可选：启动时自动交易（每天一次）
  if (s.autoTradeOnOpen && s.key && state.lastAutoDate !== todayStr()) {
    log("info", "已开启启动自动交易，准备执行");
    setTimeout(function () { if (!state.agentRunning) doAgentTrade(); }, 1200);
  }
})();
</script>
