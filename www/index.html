<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AI 选股 · 短线终端</title>
<style>
:root[data-theme="light"]{
  --bg:#F2F2F7; --bg2:#FFFFFF; --card:#FFFFFF; --text:#111114; --text2:#3C3C43;
  --sub:#8A8A8E; --line:#E6E6EB; --line2:#F0F0F4;
  --blue:#0A6CFF; --red:#F5333F; --green:#00A96E; --orange:#FF9500; --purple:#8A4BFF; --yellow:#D9A800;
  --chip:rgba(10,108,255,.10); --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.16);
  --mask:rgba(0,0,0,.32);
}
:root[data-theme="dark"]{
  --bg:#0B0C0F; --bg2:#14161A; --card:#15171C; --text:#F2F3F7; --text2:#C9CBD3;
  --sub:#7C808A; --line:#24262D; --line2:#1B1D23;
  --blue:#4C9BFF; --red:#FF5A63; --green:#26D08A; --orange:#FFA733; --purple:#A877FF; --yellow:#FFD84D;
  --chip:rgba(76,155,255,.14); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -16px rgba(0,0,0,.8);
  --mask:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,sans-serif;
  font-size:15px;padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
/* ---- 顶栏 ---- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;
}
.topbar .title{font-size:19px;font-weight:800;letter-spacing:-.3px;flex:1}
.topbar .title span{font-size:11px;font-weight:600;color:var(--sub);margin-left:6px;letter-spacing:0}
.iconbtn{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0;
}
.iconbtn:active{background:var(--line2)}
/* ---- 卡片 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 12px 12px;padding:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.card h2 .dot{width:5px;height:5px;border-radius:99px;background:var(--blue)}
.hero{margin:0 12px 12px;border-radius:18px;padding:16px;background:linear-gradient(150deg,var(--card),var(--bg2));border:1px solid var(--line);box-shadow:var(--shadow)}
/* ---- 行 ---- */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer}
.row.click:active{opacity:.6}
.grow{flex:1;min-width:0}
.nm{font-weight:650;font-size:15.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.sub{font-size:11.5px;color:var(--sub);line-height:1.45}
.right{text-align:right;flex-shrink:0}
.red{color:var(--red)}.green{color:var(--green)}
.num{font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:800;letter-spacing:-.5px}
/* ---- 徽标 ---- */
.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;margin:2px 4px 0 0;background:var(--chip);color:var(--blue);font-weight:600}
.badge.warn{background:rgba(255,149,0,.14);color:var(--orange)}
.badge.ok{background:rgba(0,169,110,.14);color:var(--green)}
.badge.bad{background:rgba(245,51,63,.14);color:var(--red)}
.score{font-weight:800;font-size:19px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
/* ---- 按钮 ---- */
.btn{display:block;width:100%;padding:12px;border:none;border-radius:13px;background:var(--blue);color:#fff;font-size:15px;font-weight:650;margin-top:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--chip);color:var(--blue)}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.45}
.btn.sm{display:inline-block;width:auto;padding:7px 13px;font-size:13px;border-radius:10px;margin:0}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{margin-top:0}
/* ---- 底部导航 ---- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--bg2);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{flex:1;padding:9px 2px 8px;background:none;border:none;color:var(--sub);font-size:10.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .ic{font-size:17px;line-height:1}
.tabbar button.active{color:var(--blue)}
/* ---- 表单 ---- */
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);color:var(--text);font-size:15px;margin:4px 0 10px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
label{font-size:12px;color:var(--sub);font-weight:600}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--blue)}
/* ---- 网格 ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.cell{padding:10px 11px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2)}
.cell .t{font-size:10.5px;color:var(--sub);font-weight:600}
.cell .v{font-size:15.5px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
/* ---- 其他 ---- */
.note{font-size:11px;color:var(--sub);line-height:1.6}
.hint{padding:34px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:9px 0}
.progress>div{height:100%;background:var(--blue);transition:width .25s;border-radius:99px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(20,20,24,.92);color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;z-index:99;max-width:84%;text-align:center;backdrop-filter:blur(10px)}
.hidden{display:none!important}
svg.chart{width:100%;display:block;overflow:visible}
/* 分段控件 */
.seg{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:12px;border:1px solid var(--line2)}
.seg button{flex:1;padding:7px 4px;border:none;background:none;color:var(--sub);font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.10)}
/* 分布条 */
.dist{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px}
.dist .lbl{width:46px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.dist .bar{flex:1;height:14px;background:var(--bg2);border-radius:4px;overflow:hidden;position:relative}
.dist .bar>i{display:block;height:100%;border-radius:4px}
.dist .cnt{width:40px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
/* 模态 */
.modal{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slide .22s ease}
@keyframes slide{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.modal .mhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line2)}
.modal .mhead .t{flex:1;font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-body{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--sub)}
.kv .v{font-weight:650;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">AI 选股<span id="subTitle">短线终端</span></div>
  <button class="iconbtn" id="btnSearch" title="搜索">⌕</button>
  <button class="iconbtn" id="btnTheme" title="主题">◐</button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="day" class="active"><span class="ic">⚡</span>短线</button>
  <button data-tab="market"><span class="ic">◎</span>行情</button>
  <button data-tab="watch"><span class="ic">★</span>自选</button>
  <button data-tab="paper"><span class="ic">▤</span>模拟盘</button>
  <button data-tab="settings"><span class="ic">⚙</span>设置</button>
</nav>

<div id="modal" class="modal hidden"></div>

<script>
"use strict";

/* ============================================================
   常量
   ============================================================ */
var SNAPSHOT_URL = "https://push2.eastmoney.com/api/qt/clist/get";
var ULIST_URL = "https://push2.eastmoney.com/api/qt/ulist.np/get";
var KLINE_URL = "https://push2his.eastmoney.com/api/qt/stock/kline/get";
var UT = "bd1d9ddb04089700cf9c27f6f7426281";
var FS = "m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23";
var FIELDS = "f2,f3,f5,f6,f7,f8,f9,f10,f12,f13,f14,f15,f16,f17,f18,f20,f21,f23,f62,f100,f184";
var PAGE_SIZE = 100;
var INDICES = [
  { code: "000001", market: 1, name: "上证指数" },
  { code: "399001", market: 0, name: "深证成指" },
  { code: "399006", market: 0, name: "创业板指" }
];

var DEFAULTS = {
  baseUrl: "https://api.deepseek.com",
  model: "deepseek-chat",
  key: "",
  targetPct: 2.5,
  stopPct: 2.5,
  maxPositions: 3,
  positionPct: 20,
  minAmount: 2,
  minFloatCap: 30,
  excludeST: true,
  excludeLimit: true,
  candidateCount: 30,
  initialCapital: 100000,
  costPct: 0.0005,
  strategy: "limitup",
  theme: "auto"
};

/* 策略权重表 */
var STRAT = {
  limitup: { label: "涨停基因", tip: "找有涨停历史、尾盘走强的票，博隔日溢价" },
  capital: { label: "主力抢筹", tip: "重仓看主力净流入占比与量比，跟资金走" },
  pullback: { label: "回踩低吸", tip: "强势股回踩均线不破，低吸等反弹" },
  breakout: { label: "趋势突破", tip: "均线多头排列 + 放量突破，做趋势延续" }
};

/* ============================================================
   主题
   ============================================================ */
function systemTheme() {
  try {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (e) { return "light"; }
}
function loadSettings() {
  var s = load("aip_settings", {});
  var out = {};
  Object.keys(DEFAULTS).forEach(function (k) { out[k] = (k in s) ? s[k] : DEFAULTS[k]; });
  return out;
}
function applyTheme(theme) {
  var t = theme === "auto" ? systemTheme() : theme;
  document.documentElement.setAttribute("data-theme", t);
  var meta = document.getElementById("metaTheme");
  if (meta) meta.setAttribute("content", t === "dark" ? "#0B0C0F" : "#F2F2F7");
  var btn = document.getElementById("btnTheme");
  if (btn) btn.textContent = theme === "auto" ? "◐" : (theme === "dark" ? "☾" : "☀");
}

/* ============================================================
   存储
   ============================================================ */
function load(k, d) {
  try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
}
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function saveSettings(s) { save("aip_settings", s); }
function loadAccount() { return load("aip_account", null); }
function saveAccount(a) { save("aip_account", a); }
function loadWatch() { return load("aip_watch", []); }
function saveWatch(w) { save("aip_watch", w); }
function resetAccount(st) {
  var a = { initialCapital: st.initialCapital, cash: st.initialCapital, positions: [], trades: [], equityHistory: [{ date: todayStr(), equity: st.initialCapital }] };
  saveAccount(a); return a;
}

/* ============================================================
   工具
   ============================================================ */
function num(v) {
  if (typeof v === "number" && isFinite(v)) return v;
  if (typeof v === "string") {
    var t = v.trim();
    if (t === "" || t === "-" || t === "--") return 0;
    var n = Number(t); return isFinite(n) ? n : 0;
  }
  return 0;
}
function text(v) { return typeof v === "string" ? v : (typeof v === "number" ? String(v) : ""); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function r2(v) { return Math.round(v * 100) / 100; }
function money(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  var a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + "万亿";
  if (a >= 1e8) return (v / 1e8).toFixed(2) + "亿";
  if (a >= 1e4) return (v / 1e4).toFixed(1) + "万";
  return v.toFixed(0);
}
function pct(v, d) {
  d = (d === undefined) ? 2 : d;
  if (v === null || v === undefined || !isFinite(v)) return "—";
  return (v >= 0 ? "+" : "") + v.toFixed(d) + "%";
}
function chgColor(v) {
  if (v === null || v === undefined || !isFinite(v) || v === 0) return "var(--sub)";
  return v > 0 ? "var(--red)" : "var(--green)";
}
function scoreColor(s) { return s >= 78 ? "var(--red)" : s >= 68 ? "var(--orange)" : s >= 55 ? "var(--yellow)" : "var(--sub)"; }
function scoreLabel(s) { return s >= 80 ? "强烈看好" : s >= 72 ? "看好" : s >= 64 ? "中性偏多" : s >= 55 ? "中性" : "观望"; }
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function toast(msg) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2400);
}
function marketOf(code) { return /^6/.test(code) ? 1 : 0; }
function median(arr) {
  if (!arr.length) return 0;
  var a = arr.slice().sort(function (x, y) { return x - y; });
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function std(arr) {
  if (arr.length < 2) return 0;
  var m = arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
  var s = arr.reduce(function (a, b) { return a + (b - m) * (b - m); }, 0) / (arr.length - 1);
  return Math.sqrt(s);
}

/* ============================================================
   网络层（APK 原生 HTTP 优先，绕过 WebView CORS）
   ============================================================ */
var NATIVE_HTTP = null;
try {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp) {
    NATIVE_HTTP = window.Capacitor.Plugins.CapacitorHttp;
  }
} catch (e) { NATIVE_HTTP = null; }

function makeResponse(status, body) {
  return { ok: status >= 200 && status < 300, status: status, text: function () { return Promise.resolve(body); } };
}

async function netFetch(url, opts) {
  opts = opts || {};
  var timeoutMs = opts.timeout || 25000;
  var method = opts.method || "GET";
  var headers = opts.headers || {};

  if (NATIVE_HTTP) {
    try {
      var p = {
        url: url, method: method, headers: headers,
        connectTimeout: timeoutMs, readTimeout: timeoutMs, responseType: "text"
      };
      if (opts.body) { try { p.data = JSON.parse(opts.body); } catch (e) { p.data = opts.body; } }
      var res = await NATIVE_HTTP.request(p);
      var body = res && res.data;
      if (typeof body !== "string") body = (body === undefined || body === null) ? "" : JSON.stringify(body);
      return makeResponse((res && res.status) || 0, body);
    } catch (e) { /* 回退 */ }
  }

  var ctrl = null, timer = null;
  if (typeof AbortController !== "undefined") {
    ctrl = new AbortController();
    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, timeoutMs);
  }
  try {
    var o = { method: method, headers: headers };
    if (opts.body) o.body = opts.body;
    if (ctrl) o.signal = ctrl.signal;
    return await fetch(url, o);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

async function fetchJson(url, retries) {
  retries = (retries === undefined) ? 2 : retries;
  var err = null;
  for (var a = 0; a <= retries; a++) {
    try {
      var r = await netFetch(url, {
        headers: {
          "Referer": "https://quote.eastmoney.com/",
          "User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
        }
      });
      if (r.ok) {
        var t = await r.text();
        if (t.trim()) return JSON.parse(t);
      }
      err = new Error("HTTP " + r.status);
    } catch (e) { err = e; }
    if (a < retries) await sleep(400 * (a + 1));
  }
  throw err instanceof Error ? err : new Error("请求失败");
}

/* ============================================================
   行情数据
   ============================================================ */
function toQuote(row) {
  return {
    code: text(row.f12), market: num(row.f13), name: text(row.f14),
    price: num(row.f2), changePct: num(row.f3), volume: num(row.f5), amount: num(row.f6),
    amplitude: num(row.f7), turnover: num(row.f8), pe: num(row.f9), volumeRatio: num(row.f10),
    high: num(row.f15), low: num(row.f16), open: num(row.f17), prevClose: num(row.f18),
    totalCap: num(row.f20), floatCap: num(row.f21), pb: num(row.f23),
    mainNetInflow: num(row.f62), mainNetRatio: num(row.f184), industry: text(row.f100)
  };
}

async function fetchSnapshotPage(p) {
  var url = SNAPSHOT_URL + "?pn=" + p + "&pz=" + PAGE_SIZE + "&po=1&np=1&fltt=2&invt=2&fid=f12&fs=" + FS + "&fields=" + FIELDS + "&ut=" + UT;
  var j = await fetchJson(url, 2);
  var d = j && j.data;
  return { rows: (d && Array.isArray(d.diff)) ? d.diff : [], total: num(d && d.total) };
}

var SNAPSHOT_CACHE = { at: 0, data: null };
async function fetchMarketSnapshot(onProgress, force) {
  if (!force && SNAPSHOT_CACHE.data && (Date.now() - SNAPSHOT_CACHE.at) < 60000) {
    if (onProgress) onProgress(SNAPSHOT_CACHE.data.length, SNAPSHOT_CACHE.data.length);
    return SNAPSHOT_CACHE.data;
  }
  var first = await fetchSnapshotPage(1);
  var quotes = [];
  function push(rows) {
    rows.forEach(function (r) {
      var q = toQuote(r);
      if (q.code && q.name) quotes.push(q);
    });
  }
  push(first.rows);
  var total = first.total;
  if (onProgress) onProgress(quotes.length, total);
  if (total > quotes.length) {
    var pages = Math.min(90, Math.ceil(total / PAGE_SIZE));
    var loaded = quotes.length;
    for (var pg = 2; pg <= pages; pg += 6) {
      var batch = [];
      for (var i = pg; i < Math.min(pg + 6, pages + 1); i++) batch.push(i);
      await Promise.all(batch.map(function (p) {
        return fetchSnapshotPage(p).then(function (x) { push(x.rows); }).catch(function () {});
      }));
      loaded += batch.length * PAGE_SIZE;
      if (onProgress) onProgress(Math.min(loaded, total), total);
    }
  }
  SNAPSHOT_CACHE = { at: Date.now(), data: quotes };
  return quotes;
}

async function fetchKlines(market, code, limit) {
  limit = limit || 120;
  var url = KLINE_URL + "?secid=" + market + "." + code +
    "&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61" +

async function fetchQuotes(secids) {

function isST(name) { return /ST|退|N |C /i.test(String(name).replace(/\s/g, "")); }

/* ============================================================
   市场统计
   ============================================================ */
function buildPulse(quotes) {
  var act = quotes.filter(function (q) { return q.price > 0; });
  var ch = act.map(function (q) { return q.changePct; });
  var up = ch.filter(function (c) { return c > 0; }).length;
  var down = ch.filter(function (c) { return c < 0; }).length;
  var flat = ch.length - up - down;
  var limitUp = ch.filter(function (c) { return c >= 9.8; }).length;
  var limitDown = ch.filter(function (c) { return c <= -9.8; }).length;
  var avg = ch.length ? ch.reduce(function (a, b) { return a + b; }, 0) / ch.length : 0;
  var amt = act.reduce(function (s, q) { return s + q.amount; }, 0);
  var breadth = ch.length ? (up - down) / ch.length : 0;
  var sentiment = Math.round(clamp(50 + breadth * 45 + clamp(avg * 3, -20, 20) + clamp((limitUp - limitDown) * 0.15, -12, 12), 0, 100));

  // 涨跌分布
  var buckets = [
    { lbl: "≤-7", lo: -99, hi: -7, color: "var(--green)" },
    { lbl: "-7~-5", lo: -7, hi: -5, color: "var(--green)" },
    { lbl: "-5~-3", lo: -5, hi: -3, color: "var(--green)" },
    { lbl: "-3~-1", lo: -3, hi: -1, color: "var(--green)" },
    { lbl: "-1~0", lo: -1, hi: 0, color: "var(--green)" },
    { lbl: "0", lo: 0, hi: 0, color: "var(--sub)" },
    { lbl: "0~1", lo: 0, hi: 1, color: "var(--red)" },
    { lbl: "1~3", lo: 1, hi: 3, color: "var(--red)" },
    { lbl: "3~5", lo: 3, hi: 5, color: "var(--red)" },
    { lbl: "5~7", lo: 5, hi: 7, color: "var(--red)" },
    { lbl: "≥7", lo: 7, hi: 99, color: "var(--red)" }
  ];
  buckets.forEach(function (b) {
    b.count = ch.filter(function (c) {
      if (b.lbl === "0") return c === 0;
      if (b.lbl === "≤-7") return c < 0 && c <= -7;
      if (b.lbl === "-7~-5") return c > -7 && c <= -5;
      if (b.lbl === "-5~-3") return c > -5 && c <= -3;
      if (b.lbl === "-3~-1") return c > -3 && c <= -1;
      if (b.lbl === "-1~0") return c > -1 && c < 0;
      if (b.lbl === "0~1") return c > 0 && c <= 1;
      if (b.lbl === "1~3") return c > 1 && c <= 3;
      if (b.lbl === "3~5") return c > 3 && c <= 5;
      if (b.lbl === "5~7") return c > 5 && c <= 7;
      if (b.lbl === "≥7") return c > 7;
      return false;
    }).length;
  });

  var im = {};
  act.forEach(function (q) {
    var k = q.industry || "其他";
    var e = im[k] || (im[k] = { sum: 0, count: 0, amount: 0, inflow: 0 });
    e.sum += q.changePct; e.count++; e.amount += q.amount; e.inflow += q.mainNetInflow;
  });
  var inds = Object.keys(im).filter(function (k) { return im[k].count >= 3; }).map(function (k) {
    return { name: k, avgChange: im[k].sum / im[k].count, count: im[k].count, amount: im[k].amount, inflow: im[k].inflow };
  }).sort(function (a, b) { return b.avgChange - a.avgChange; });

  return {
    updatedAt: Date.now(), count: act.length, up: up, down: down, flat: flat,
    limitUp: limitUp, limitDown: limitDown, avgChange: avg, medianChange: median(ch),
    totalAmount: amt, sentiment: sentiment,
    topGainers: act.slice().sort(function (a, b) { return b.changePct - a.changePct; }).slice(0, 10),
    topLosers: act.slice().sort(function (a, b) { return a.changePct - b.changePct; }).slice(0, 10),
    industries: inds, buckets: buckets
  };
}

function capitalFlow(quotes) {
  var act = quotes.filter(function (q) { return q.price > 0 && q.amount > 0; });
  return {
    inflow: act.slice().sort(function (a, b) { return b.mainNetInflow - a.mainNetInflow; }).slice(0, 10),
    outflow: act.slice().sort(function (a, b) { return a.mainNetInflow - b.mainNetInflow; }).slice(0, 10)
  };
}

/* ============================================================
   技术指标
   ============================================================ */
function maAt(closes, i, period) {
  if (i < period - 1) return null;
  var s = 0;
  for (var k = i - period + 1; k <= i; k++) s += closes[k];
  return s / period;
}
function countLimitUps(k) {
  var c = 0;
  for (var i = 0; i < k.length; i++) if (k[i].changePct >= 9.5) c++;
  return c;
}
function computeMetrics(k) {
  var closes = k.map(function (x) { return x.close; });
  var n = closes.length;
  var last = n - 1;
  var ma5 = maAt(closes, last, 5) || 0, ma10 = maAt(closes, last, 10) || 0, ma20 = maAt(closes, last, 20) || 0, ma60 = maAt(closes, last, 60) || 0;
  var ma20Prev = maAt(closes, Math.max(0, last - 5), 20) || ma20;
  var ma20Slope = ma20Prev ? ((ma20 - ma20Prev) / ma20Prev) * 100 : 0;
  var c0 = closes[last] || 0;
  var r5 = n > 6 && closes[last - 5] ? ((c0 - closes[last - 5]) / closes[last - 5]) * 100 : 0;
  var r20 = n > 21 && closes[last - 20] ? ((c0 - closes[last - 20]) / closes[last - 20]) * 100 : 0;
  var r60 = n > 61 && closes[last - 60] ? ((c0 - closes[last - 60]) / closes[last - 60]) * 100 : 0;
  var upDays = 0;
  for (var i = last; i > 0; i--) { if (k[i].close >= k[i - 1].close) upDays++; else break; }
  var slice20 = closes.slice(-20), slice60 = closes.slice(-60);
  var rets = [];
  for (var j = 1; j < slice20.length; j++) rets.push((slice20[j] - slice20[j - 1]) / slice20[j - 1]);
  var vol = rets.length ? std(rets) * Math.sqrt(252) * 100 : 0;
  var peak = -1e18, mdd = 0;
  slice60.forEach(function (c) {
    if (c > peak) peak = c;
    if (peak > 0) mdd = Math.max(mdd, (peak - c) / peak * 100);
  });
  return {
    ma5: ma5, ma10: ma10, ma20: ma20, ma60: ma60, ma20Slope: ma20Slope,
    r5: r5, r20: r20, r60: r60, upDays: upDays,
    max60: slice60.length ? Math.max.apply(null, slice60) : c0,
    min60: slice60.length ? Math.min.apply(null, slice60) : c0,
    volatility: vol, maxDrawdown: mdd,
    limitUps: countLimitUps(k.slice(-20))
  };
}

/* ============================================================
   短线评分（多策略）
   ============================================================ */
function dayScore(q, k, industryChange, stratKey) {
  var m = computeMetrics(k);
  var cp = q.high > q.low ? (q.price - q.low) / (q.high - q.low) : 0.5;
  var chg = q.changePct;
  var s = 0;
  var tags = [];

  var W = {
    limitup:  { chg: 20, pos: 16, vol: 12, turn: 6, cap: 12, lu: 16, ma: 10, ind: 8 },
    capital:  { chg: 12, pos: 10, vol: 12, turn: 4, cap: 26, lu: 6,  ma: 10, ind: 10 },
    pullback: { chg: 8,  pos: 14, vol: 10, turn: 4, cap: 10, lu: 4,  ma: 18, ind: 8 },
    breakout: { chg: 14, pos: 14, vol: 16, turn: 4, cap: 10, lu: 6,  ma: 18, ind: 8 }
  }[stratKey] || { chg: 20, pos: 16, vol: 12, turn: 6, cap: 12, lu: 16, ma: 10, ind: 8 };

  // 涨幅分（不同策略偏好不同区间）
  var chgScore = 0;
  if (stratKey === "pullback") {
    if (chg >= -3 && chg <= 1.5) chgScore = 1;
    else if (chg > 1.5 && chg <= 5) chgScore = 0.55;
    else chgScore = 0.15;
  } else if (stratKey === "capital") {
    if (chg >= 0.5 && chg <= 7) chgScore = 1;
    else if (chg > 7 && chg < 9.5) chgScore = 0.6;
    else chgScore = 0.2;
  } else {
    if (chg >= 2 && chg <= 6.5) chgScore = 1;
    else if (chg > 0 && chg < 2) chgScore = 0.5;
    else if (chg > 6.5 && chg < 9.5) chgScore = 0.35;
    else chgScore = 0.1;
  }
  s += W.chg * chgScore;

  // 收盘位置
  var posScore = cp >= 0.85 ? 1 : cp >= 0.7 ? 0.8 : cp >= 0.5 ? 0.5 : 0.15;
  s += W.pos * posScore;

  // 量比
  var volScore = (q.volumeRatio >= 1.4 && q.volumeRatio <= 4.2) ? 1 : q.volumeRatio > 4.2 ? 0.55 : 0.35;
  s += W.vol * volScore;

  // 换手
  var turnScore = (q.turnover >= 4 && q.turnover <= 16) ? 1 : q.turnover > 16 ? 0.5 : 0.3;
  s += W.turn * turnScore;

  // 资金
  s += W.cap * clamp((q.mainNetRatio + 3) / 13, 0, 1);

  // 涨停基因
  s += W.lu * clamp(m.limitUps / 4, 0, 1);

  // 均线结构
  var maScore = 0;
  if (m.ma5 > m.ma10 && m.ma10 > m.ma20) maScore = 1;
  else if (m.ma5 > m.ma20) maScore = 0.6;
  else maScore = 0.25;
  if (stratKey === "pullback") {
    // 回踩：价格靠近 MA10/MA20 且未破
    var nearMa10 = m.ma10 > 0 ? Math.abs(q.price - m.ma10) / m.ma10 : 1;
    var nearMa20 = m.ma20 > 0 ? Math.abs(q.price - m.ma20) / m.ma20 : 1;
    var touching = Math.min(nearMa10, nearMa20) < 0.025;
    maScore = touching ? 1 : (q.price > m.ma20 ? 0.7 : 0.2);
    if (m.r20 > 5 && touching) maScore = 1;
  }
  s += W.ma * maScore;

  // 行业风口
  s += W.ind * clamp((industryChange + 1) / 5, 0, 1);

  s = clamp(Math.round(s), 0, 100);

  // 标签
  if (m.limitUps >= 1) tags.push("涨停基因×" + m.limitUps);
  if (cp >= 0.85) tags.push("尾盘抢筹");
  if (q.volumeRatio >= 1.4) tags.push("放量");
  if (q.mainNetRatio >= 5) tags.push("主力净流入");
  if (m.ma5 > m.ma10 && m.ma10 > m.ma20) tags.push("多头排列");
  if (industryChange >= 2) tags.push("风口");
  if (stratKey === "pullback" && q.price >= m.ma20 * 0.99 && q.price <= m.ma20 * 1.03) tags.push("回踩MA20");
  if (stratKey === "breakout" && m.max60 > 0 && q.price / m.max60 > 0.97) tags.push("逼近新高");

  return {
    quote: q, score: s, tags: tags, metrics: m,
    closePosition: cp, klines: k
  };
}

function preRank(qs, st) {
  var arr = qs.map(function (q) {
    var cp = q.high > q.low ? (q.price - q.low) / (q.high - q.low) : 0.5;
    var s = 0;
    if (q.changePct >= 2 && q.changePct <= 6.5) s += 8;
    else if (q.changePct > 0) s += 3;
    else s -= 4;
    s += cp >= 0.8 ? 6 : cp >= 0.6 ? 3 : 0;
    s += Math.max(0, Math.min(q.volumeRatio, 5)) * 2;
    s += Math.max(-8, Math.min(q.mainNetRatio, 15)) * 1.2;
    s += Math.min(q.turnover, 15) * 0.3;
    s += q.amount > 0 ? Math.min(Math.log10(q.amount) - 8, 2) * 3 : 0;
    return { q: q, s: s };
  });
  arr.sort(function (a, b) { return b.s - a.s; });
  return arr.slice(0, Math.max(10, st.candidateCount)).map(function (x) { return x.q; });
}

/* ============================================================
   隔日回测
   ============================================================ */
function backtestDay(klines) {
  var k = klines;
  var rets = [];
  for (var i = 1; i < k.length - 2; i++) {
    var b = k[i], prev = k[i - 1];
    if (!prev.close) continue;
    var chg = (b.close - prev.close) / prev.close * 100;
    var cp = b.high > b.low ? (b.close - b.low) / (b.high - b.low) : 0.5;
    if (chg >= 2 && chg <= 6.5 && cp >= 0.75) {
      // 信号日次日开盘买入，第三日收盘卖出（满足 T+1）
      var buy = k[i + 1].open > 0 ? k[i + 1].open : b.close;
      var sell = k[i + 2].close;
      if (buy > 0 && sell > 0) rets.push((sell - buy) / buy * 100);
    }
  }
  if (!rets.length) return null;
  var wins = rets.filter(function (r) { return r > 0; }).length;
  var avg = rets.reduce(function (a, b) { return a + b; }, 0) / rets.length;
  var equity = 1, peak = 1, mdd = 0;
  rets.forEach(function (r) {
    equity *= (1 + r / 100);
    if (equity > peak) peak = equity;
    mdd = Math.max(mdd, (peak - equity) / peak * 100);
  });
  return {
    trades: rets.length, winRate: wins / rets.length * 100, avgRet: avg,
    totalRet: (equity - 1) * 100, maxDD: mdd,
    best: Math.max.apply(null, rets), worst: Math.min.apply(null, rets)
  };
}

/* ============================================================
   扫描主流程
   ============================================================ */
async function runDayScan(st, onP) {
  if (onP) onP("拉取全市场行情…", 0, 0);
  var quotes = await fetchMarketSnapshot(function (l, t) {
    if (onP) onP("拉取行情 " + l + "/" + t, l, t);
  }, true);
  if (!quotes.length) throw new Error("行情获取失败，请检查网络");

  var filtered = quotes.filter(function (q) {
    if (!q.code || !q.name) return false;
    if (q.price <= 0) return false;
    if (st.excludeST && isST(q.name)) return false;
    if (q.name.indexOf("退") >= 0) return false;
    if (st.excludeLimit && (q.changePct >= 9.5 || q.changePct <= -9.5)) return false;
    if (q.floatCap > 0 && q.floatCap < st.minFloatCap * 1e8) return false;
    if (q.amount < st.minAmount * 1e8) return false;
    return true;
  });
  if (!filtered.length) throw new Error("过滤后无符合条件的股票，请放宽条件");

  var pulse = buildPulse(quotes);
  var indMap = {};
  pulse.industries.forEach(function (x) { indMap[x.name] = x.avgChange; });

  var cands = preRank(filtered, st);
  if (onP) onP("获取日线并评分…", 0, cands.length);
  var done = 0, scored = [];
  for (var i = 0; i < cands.length; i += 5) {
    var batch = cands.slice(i, i + 5);
    var rs = await Promise.all(batch.map(async function (quote) {
      var k = [];
      try { k = await fetchKlines(quote.market, quote.code, 120); } catch (e) {}
      done++;
      if (onP) onP("评分中 " + done + "/" + cands.length, done, cands.length);
      if (k.length < 25) return null;
      var pick = dayScore(quote, k, indMap[quote.industry] || 0, st.strategy);
      pick.targetPrice = r2(quote.price * (1 + st.targetPct / 100));
      pick.stopPrice = r2(quote.price * (1 - st.stopPct / 100));
      pick.targetPct = st.targetPct;
      pick.stopPct = st.stopPct;
      pick.backtest = backtestDay(k);
      return pick;
    }));
    rs.forEach(function (s) { if (s) scored.push(s); });
  }
  if (!scored.length) throw new Error("候选股数据不足，请重试");

  scored.sort(function (a, b) { return b.score - a.score; });
  var plan = { picks: scored.slice(0, 12), pulse: pulse, updatedAt: Date.now(), strategy: st.strategy };
  state.plan = plan;
  state.pulse = pulse;
  state.flow = capitalFlow(quotes);
  state.quotes = quotes;
  save("aip_plan", plan);
  save("aip_pulse", pulse);
  save("aip_flow", state.flow);
  return plan;
}

  if (pick.score) L.push("综合评分 " + pick.score + "/100，标签：" + ((pick.tags && pick.tags.join("、")) || "无"));
  L.push("请用 180 字内回答：① 是否值得隔日参与 ② 关键买点与止损 ③ 最大风险。结尾注明不构成投资建议。");
  return L.join("\n");
}

   图表
   ============================================================ */
function lineChart(klines, opts) {
  opts = opts || {};
  var h = opts.height || 132;
  var closes = klines.map(function (k) { return k.close; });
  var n = closes.length;
  if (n < 2) return '<div class="sub" style="padding:20px 0;text-align:center">数据不足</div>';
  var W = 340, H = h, pad = 4;
  var all = closes.slice();
  var ma5 = [], ma20 = [];
  for (var i = 0; i < n; i++) { ma5.push(maAt(closes, i, 5)); ma20.push(maAt(closes, i, 20)); }
  ma5.forEach(function (v) { if (v) all.push(v); });
  ma20.forEach(function (v) { if (v) all.push(v); });
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  var rng = (mx - mn) || 1;
  function px(i) { return pad + (i / (n - 1)) * (W - pad * 2); }
  function py(v) { return pad + (1 - (v - mn) / rng) * (H - pad * 2); }
  function poly(arr) {
    var pts = [];
    for (var i = 0; i < arr.length; i++) if (arr[i]) pts.push(px(i).toFixed(1) + "," + py(arr[i]).toFixed(1));
    return pts.join(" ");
  }
  var lastColor = closes[n - 1] >= closes[0] ? "var(--red)" : "var(--green)";
  var up = closes[n - 1] >= closes[n - 2];
  var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">';
  s += '<polyline points="' + poly(ma20) + '" fill="none" stroke="var(--purple)" stroke-width="1" opacity=".75"/>';
  s += '<polyline points="' + poly(ma5) + '" fill="none" stroke="var(--orange)" stroke-width="1" opacity=".8"/>';
  s += '<polyline points="' + poly(closes) + '" fill="none" stroke="' + (up ? "var(--red)" : "var(--green)") + '" stroke-width="1.8" stroke-linejoin="round"/>';
  s += "</svg>";
  var legend = '<div style="display:flex;gap:12px;font-size:10.5px;color:var(--sub);margin-top:2px">'
    + '<span><i style="display:inline-block;width:10px;height:2px;background:' + lastColor + ';vertical-align:middle"></i> 收盘</span>'
    + '<span><i style="display:inline-block;width:10px;height:2px;background:var(--orange);vertical-align:middle"></i> MA5</span>'
    + '<span><i style="display:inline-block;width:10px;height:2px;background:var(--purple);vertical-align:middle"></i> MA20</span>'
    + '<span style="margin-left:auto">' + klines[0].date.slice(5) + " ~ " + klines[n - 1].date.slice(5) + "</span></div>";
  return s + legend;
}

function equityChart(history) {
  if (!history || history.length < 2) return "";
  var W = 340, H = 104, pad = 4;
  var vals = history.map(function (p) { return p.equity; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var rng = (mx - mn) || 1;
  var pts = vals.map(function (v, i) {
    var x = pad + (i / (vals.length - 1)) * (W - pad * 2);
    var y = pad + (1 - (v - mn) / rng) * (H - pad * 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  var up = vals[vals.length - 1] >= vals[0];
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">'
    + '<polyline points="' + pts + '" fill="none" stroke="' + (up ? "var(--red)" : "var(--green)") + '" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}

/* ============================================================
   模拟盘
   ============================================================ */
function positionValue(p, px) { return (px > 0 ? px : p.buyPrice) * p.shares; }
function accountEquity(a, priceMap) {
  var v = a.cash;
  (a.positions || []).forEach(function (p) {
    v += positionValue(p, (priceMap && priceMap[p.code]) || 0);
  });
  return v;
}

function accountStats(a, priceMap) {
  var hist = (a.equityHistory && a.equityHistory.length) ? a.equityHistory : [{ date: todayStr(), equity: a.initialCapital }];
  var eq = accountEquity(a, priceMap);
  var total = a.initialCapital > 0 ? (eq - a.initialCapital) / a.initialCapital * 100 : 0;
  var days = Math.max(1, hist.length);
  var ann = (eq > 0 && a.initialCapital > 0 && days > 1) ? (Math.pow(eq / a.initialCapital, 365 / days) - 1) * 100 : 0;
  var peak = -1e18, mdd = 0;
  hist.forEach(function (p) {
    if (p.equity > peak) peak = p.equity;
    if (peak > 0) mdd = Math.max(mdd, (peak - p.equity) / peak * 100);
  });
  var sells = (a.trades || []).filter(function (t) { return t.side === "sell"; });
  var wins = sells.filter(function (t) { return (t.pnlAmount || 0) > 0; }).length;
  // 日收益序列 → 夏普
  var dayRets = [];
  for (var i = 1; i < hist.length; i++) {
    if (hist[i - 1].equity > 0) dayRets.push((hist[i].equity - hist[i - 1].equity) / hist[i - 1].equity);
  }
  var sharpe = 0;
  if (dayRets.length > 1) {
    var avgR = dayRets.reduce(function (x, y) { return x + y; }, 0) / dayRets.length;
    var sd = std(dayRets);
    sharpe = sd > 0 ? (avgR / sd) * Math.sqrt(250) : 0;
  }
  // 最大连亏
  var maxLoseStreak = 0, streak = 0;
  sells.forEach(function (t) {
    if ((t.pnlAmount || 0) <= 0) { streak++; maxLoseStreak = Math.max(maxLoseStreak, streak); }
    else streak = 0;
  });
  var totalPnl = sells.reduce(function (s, t) { return s + (t.pnlAmount || 0); }, 0);
  return {
    equity: eq, cash: a.cash, positionValue: eq - a.cash,
    totalReturnPct: total, annualizedPct: ann, maxDrawdownPct: mdd,
    tradeCount: sells.length, wins: wins, losses: sells.length - wins,
    winRate: sells.length ? wins / sells.length * 100 : 0,
    sharpe: sharpe, maxLoseStreak: maxLoseStreak, totalPnl: totalPnl,
    days: days, holding: (a.positions || []).length
  };
}

async function settleDay(a, st, plan) {
  var today = todayStr();
  var secids = [], seen = {};
  (a.positions || []).forEach(function (p) { secids.push({ market: p.market, code: p.code }); seen[p.code] = 1; });
  var buys = plan ? plan.picks.slice(0, st.maxPositions) : [];
  buys.forEach(function (p) {
    if (!seen[p.quote.code]) { seen[p.quote.code] = 1; secids.push({ market: p.quote.market, code: p.quote.code }); }
  });
  var quotes = await fetchQuotes(secids);
  function priceOf(code) {
    var x = quotes.filter(function (z) { return z.code === code; })[0];
    return (x && x.price > 0) ? x.price : 0;
  }
  var trades = [], cash = a.cash, remaining = [];
  (a.positions || []).forEach(function (p) {
    var px = priceOf(p.code) || p.buyPrice;
    var reason = null;
    if (px >= p.targetPrice) reason = "止盈";
    else if (px <= p.stopPrice) reason = "止损";
    else if (p.buyDate !== today) reason = "时间止损";
    if (reason) {
      var amt = px * p.shares * (1 - st.costPct);
      var pnl = amt - p.cost;
      cash += amt;
      trades.push({
        date: today, code: p.code, name: p.name, side: "sell", price: px, shares: p.shares,
        amount: amt, pnlPct: p.cost > 0 ? pnl / p.cost * 100 : 0, pnlAmount: pnl, reason: reason
      });
    } else remaining.push(p);
  });
  var positions = remaining.slice();
  var slots = st.maxPositions - positions.length;
  buys.forEach(function (pick) {
    if (slots <= 0) return;
    if (positions.some(function (p) { return p.code === pick.quote.code; })) return;
    var px = priceOf(pick.quote.code) || pick.quote.price;
    var eq = cash + positions.reduce(function (s, p) { return s + positionValue(p, priceOf(p.code) || p.buyPrice); }, 0);
    var budget = eq * st.positionPct / 100;
    if (budget < px * 100) return;
    var shares = Math.floor(budget / (px * 100)) * 100;
    if (shares <= 0) return;
    var cost = px * shares * (1 + st.costPct);
    if (cost > cash) return;
    cash -= cost;
    positions.push({
      code: pick.quote.code, market: pick.quote.market, name: pick.quote.name,
      buyDate: today, buyPrice: px, shares: shares, cost: cost,
      targetPrice: r2(px * (1 + st.targetPct / 100)), stopPrice: r2(px * (1 - st.stopPct / 100))
    });
    trades.push({ date: today, code: pick.quote.code, name: pick.quote.name, side: "buy", price: px, shares: shares, amount: cost, reason: "短线买入" });
    slots--;
  });
  var next = {
    initialCapital: a.initialCapital, cash: cash, positions: positions,
    trades: (a.trades || []).concat(trades),
    equityHistory: (a.equityHistory || []).concat([{
      date: today,
      equity: cash + positions.reduce(function (s, p) { return s + positionValue(p, priceOf(p.code) || p.buyPrice); }, 0)
    }])
  };
  saveAccount(next);
  return next;
}

async function closeAll(a, st) {
  if (!a || !(a.positions || []).length) return a;
  var today = todayStr();
  var quotes = await fetchQuotes(a.positions.map(function (p) { return { market: p.market, code: p.code }; }));
  function priceOf(code) {
    var x = quotes.filter(function (z) { return z.code === code; })[0];
    return (x && x.price > 0) ? x.price : 0;
  }
  var cash = a.cash, trades = [];
  a.positions.forEach(function (p) {
    var px = priceOf(p.code) || p.buyPrice;
    var amt = px * p.shares * (1 - st.costPct);
    var pnl = amt - p.cost;
    cash += amt;
    trades.push({
      date: today, code: p.code, name: p.name, side: "sell", price: px, shares: p.shares,
      amount: amt, pnlPct: p.cost > 0 ? pnl / p.cost * 100 : 0, pnlAmount: pnl, reason: "手动清仓"
    });
  });
  var next = {
    initialCapital: a.initialCapital, cash: cash, positions: [],
    trades: (a.trades || []).concat(trades),
    equityHistory: (a.equityHistory || []).concat([{ date: today, equity: cash }])
  };
  saveAccount(next);
  return next;
}

async function refreshWatch() {
  var w = loadWatch();
  var el = document.getElementById("watchList");
  if (!el || !w.length) return;
  var quotes = await fetchQuotes(w.map(function (x) { return { market: x.market, code: x.code }; }));
  var html = "";
  w.forEach(function (item) {
    var q = quotes.filter(function (x) { return x.code === item.code; })[0];
    var px = (q && q.price > 0) ? q.price : item.addPrice;
    var chg = q ? q.changePct : null;
    var pnl = item.addPrice > 0 ? (px - item.addPrice) / item.addPrice * 100 : 0;
    html += '<div class="row">'
      + '<div class="grow click" data-code="' + esc(item.code) + '" data-market="' + item.market + '">'
      + '<div class="nm">' + esc(item.name) + '</div>'
      + '<div class="sub">自选价 ' + item.addPrice.toFixed(2) + " · 浮盈 " + pct(pnl) + "</div></div>"
      + '<div class="right"><div class="num" style="font-weight:700;color:' + chgColor(chg) + '">' + px.toFixed(2) + "</div>"
      + '<div class="sub num" style="color:' + chgColor(chg) + '">' + pct(chg) + "</div></div>"
      + '<button class="btn sm ghost" data-rm="' + esc(item.code) + '" style="margin-left:6px">删</button></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll("[data-rm]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      var code = b.getAttribute("data-rm");
      saveWatch(loadWatch().filter(function (x) { return x.code !== code; }));
      renderWatch();
      toast("已移除");
    });
  });
  bindDetailClicks(el);
}

async function refreshPositions() {
  var a = loadAccount();
  var el = document.getElementById("posList");
  if (!a || !el) return;
  var quotes = await fetchQuotes(a.positions.map(function (p) { return { market: p.market, code: p.code }; }));
  var html = "";
  a.positions.forEach(function (p) {
    var q = quotes.filter(function (x) { return x.code === p.code; })[0];
    var px = (q && q.price > 0) ? q.price : p.buyPrice;
    var pnl = (px - p.buyPrice) * p.shares;
    var pp = p.buyPrice > 0 ? (px - p.buyPrice) / p.buyPrice * 100 : 0;
    var hitTarget = px >= p.targetPrice, hitStop = px <= p.stopPrice;
    html += '<div class="row click" data-code="' + esc(p.code) + '" data-market="' + p.market + '">'
      + '<div class="grow"><div class="nm">' + esc(p.name) + "</div>"
      + '<div class="sub">' + p.shares + "股 @ " + p.buyPrice.toFixed(2) + " · 现价 " + px.toFixed(2) + "</div>"
      + '<div class="sub">目标 <span class="red">' + p.targetPrice.toFixed(2) + '</span> · 止损 <span class="green">' + p.stopPrice.toFixed(2) + "</span>"
      + (hitTarget ? ' <span class="badge ok">已达止盈</span>' : hitStop ? ' <span class="badge bad">已破止损</span>' : "")
      + "</div></div>"
      + '<div class="right"><div class="num" style="font-weight:750;color:' + chgColor(pnl) + '">' + (pnl >= 0 ? "+" : "") + money(pnl) + "</div>"
      + '<div class="sub num" style="color:' + chgColor(pp) + '">' + pct(pp) + "</div></div></div>";
  });
  el.innerHTML = html;
  bindDetailClicks(el);
}

function renderCompound() {
  var out = document.getElementById("cmpOut");
  if (!out) return;
  var rateEl = document.getElementById("inpRate");
  var daysEl = document.getElementById("inpDays");
  if (!rateEl || !daysEl) return;
  var rate = +rateEl.value, days = +daysEl.value;
  var rv = document.getElementById("cmpRateV"), dv = document.getElementById("cmpDaysV");
  if (rv) rv.textContent = rate.toFixed(1) + "%";
  if (dv) dv.textContent = days;
  var cap = loadSettings().initialCapital;
  var fv = cap * Math.pow(1 + rate / 100, days);
  out.innerHTML = '<div class="sub">' + money(cap) + " × 每日 " + rate.toFixed(1) + "% × " + days + " 天</div>"
    + '<div class="num" style="font-size:22px;font-weight:800;color:var(--red);letter-spacing:-.8px">' + money(fv) + "</div>"
    + '<div class="note" style="margin-top:4px">纯数学复利推演，未考虑亏损日、滑点与手续费。现实无法保证每日正收益。</div>';
}

    if (id === "f_target" || id === "f_stop" || id === "f_pos") return val + "%";
    if (id === "f_max") return val + " 支";
    if (id === "f_amt") return val + " 亿";
    if (id === "f_cand") return val + " 只";
    if (id === "f_cap") return (val / 10000).toFixed(0) + " 万";
    if (id === "f_cost") return "万分之 " + val;
    return String(val);

  function slider(id, title, val, min, max, step) {
    return '<label>' + title + '：<b id="' + id + 'v">' + fmt(id, val) + "</b></label>"

    + '<span style="font-size:13.5px">剔除 ST / 退市股</span>'

    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0">'
    + '<span style="font-size:13.5px">剔除涨跌停股</span>'
    + '<button class="btn sm ' + (st.excludeLimit ? "" : "ghost") + '" id="btnLimit">' + (st.excludeLimit ? "已开启" : "已关闭") + "</button></div>"
    + "</div>";

  html += '<div class="card"><h2><span class="dot"></span>模拟盘</h2>'
    + slider("f_cap", "初始资金", st.initialCapital, 10000, 1000000, 10000)

      toast("已从自选移除");
    } else {
      w.push({ code: code, market: market, name: quote.name, addedAt: Date.now(), addPrice: quote.price });
      saveWatch(w);
      toast("已加入自选");
    }
    openDetail(code, market);
  });

  document.getElementById("mAI").addEventListener("click", async function () {
    var st = loadSettings();
    var out = document.getElementById("mAIOut");
    if (!st.key) { out.textContent = "请先在「设置」填写 API Key。"; return; }
    out.textContent = "AI 分析中…";
    try {
      var pseudoPick = {
        quote: quote, score: 70, tags: [], metrics: m,
        backtest: bt
      };
      var txt = await aiChat(buildStockPrompt(pseudoPick), st);
      out.textContent = txt;
    } catch (e) {
      out.textContent = "AI 点评失败：" + (e && e.message ? e.message : String(e));
    }
  });
}

function closeModal() {
  var modal = document.getElementById("modal");
  modal.classList.add("hidden");
  modal.innerHTML = "";
  if (history.state && history.state.modal) { try { history.back(); } catch (e) {} }
}

/* ============================================================
   搜索
   ============================================================ */
async function openSearch() {
  var modal = document.getElementById("modal");
  modal.classList.remove("hidden");
  modal.innerHTML = '<div class="mhead"><button class="iconbtn" id="mClose">✕</button>'
    + '<div class="t">搜索股票</div></div>'
    + '<div class="modal-body">'
    + '<input id="inpSearch" placeholder="输入代码或名称，如 600519 / 茅台" autofocus>'
    + '<div id="searchOut" class="sub">输入关键字开始搜索</div></div>';
  document.getElementById("mClose").addEventListener("click", closeModal);

  var input = document.getElementById("inpSearch");
  var timer = null;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { doSearch(input.value.trim()); }, 260);
  });

  async function doSearch(kw) {
    var out = document.getElementById("searchOut");
    if (!kw) { out.textContent = "输入关键字开始搜索"; return; }
    if (!state.quotes) {
      out.textContent = "首次搜索需加载全市场数据…";
      try { state.quotes = await fetchMarketSnapshot(); } catch (e) { out.textContent = "加载失败：" + e.message; return; }
    }
    var q = kw.toUpperCase();
    var hits = state.quotes.filter(function (x) {
      return x.code.indexOf(q) >= 0 || x.name.toUpperCase().indexOf(q) >= 0;
    }).slice(0, 40);
    if (!hits.length) { out.innerHTML = '<div class="hint">没有找到匹配的股票</div>'; return; }
    out.innerHTML = hits.map(function (x) { return stockRow(x); }).join("");
    bindDetailClicks(out);
  }
}

/* ============================================================
   事件绑定
   ============================================================ */
function bindDetailClicks(root) {
  (root || view).querySelectorAll("[data-code]").forEach(function (el) {
    el.addEventListener("click", function () {
      openDetail(el.getAttribute("data-code"), +el.getAttribute("data-market"));
    });
  });
}

function bindAll() {
  bindDetailClicks(view);
  bind("btnScan", doScan);
  bind("btnAI", doAI);
  bind("btnSettle", doSettle);
  bind("btnRefresh", doRefreshMarket);
  bind("btnInit", function () { resetAccount(loadSettings()); renderPaper(); });
  bind("btnReset", function () {
    if (!confirm("确认重置模拟盘？所有持仓与记录将清空。")) return;
    resetAccount(loadSettings()); renderPaper(); toast("已重置");
  });
  bind("btnClose", async function () {
    var a = loadAccount(); if (!a) return;
    if (!confirm("确认按当前价清空全部持仓？")) return;
    await closeAll(a, loadSettings()); renderPaper(); toast("已清仓");
  });
  bind("btnAdd", addWatch);
  bind("btnSave", saveAllSettings);
  bind("btnTest", testAI);
  bind("btnNet", netSelfTest);
  bind("btnExport", exportData);
  bind("btnClearCache", function () {
    SNAPSHOT_CACHE = { at: 0, data: null };
    state.quotes = null;
    toast("行情缓存已清空");
  });
  bind("btnST", function () {
    var s = loadSettings(); s.excludeST = !s.excludeST; saveSettings(s); renderSettings();
  });
  bind("btnLimit", function () {
    var s = loadSettings(); s.excludeLimit = !s.excludeLimit; saveSettings(s); renderSettings();
  });
  view.querySelectorAll("[data-strat]").forEach(function (b) {
    b.addEventListener("click", function () {
      var s = loadSettings(); s.strategy = b.getAttribute("data-strat"); saveSettings(s); renderDay();
    });
  });
}

function bind(id, fn) {
  var b = document.getElementById(id);
  if (b) b.addEventListener("click", fn);
}

/* ============================================================
   动作
   ============================================================ */
async function doScan() {
  if (state.scanning) return;
  state.scanning = true; renderDay();
  try {
    var st = loadSettings();
    await runDayScan(st, function (msg, cur, total) {
      state.progText = msg; state.progCur = cur; state.progTotal = total;
      var el = document.querySelector(".progress > div");
      var txt = document.querySelector(".card .sub");
      if (el && total > 0) el.style.width = Math.round(cur / total * 100) + "%";
      if (txt) txt.textContent = msg;
    });
    toast("扫描完成，共 " + state.plan.picks.length + " 只入选");
  } catch (e) {
    alert("扫描失败：" + (e && e.message ? e.message : String(e)));
  }
  state.scanning = false;
  renderDay();
}

async function doAI() {
  var st = loadSettings();
  if (!st.key) { toast("请先在「设置」填写 API Key"); return; }
  state.aiLoading = true; renderDay();
  try {
    if (!state.pulse) {
      var q = await fetchMarketSnapshot();
      state.pulse = buildPulse(q);
      state.flow = capitalFlow(q);
      save("aip_pulse", state.pulse); save("aip_flow", state.flow);
    }
    var f = state.flow || { inflow: [], outflow: [] };
    state.aiText = await aiChat(buildMarketPrompt(state.pulse, state.plan, f.inflow, f.outflow), st);
  } catch (e) {
    state.aiText = "AI 研判失败：" + (e && e.message ? e.message : String(e));
  }
  state.aiLoading = false;
  renderDay();
}

async function doSettle() {
  if (state.settling) return;
  state.settling = true; renderDay();
  try {
    var a = loadAccount() || resetAccount(loadSettings());
    await settleDay(a, loadSettings(), state.plan);
    toast("结算完成");
  } catch (e) {
    alert("结算失败：" + (e && e.message ? e.message : String(e)));
  }
  state.settling = false;
  renderDay();
}

async function doRefreshMarket() {
  toast("刷新中…");
  try {
    var q = await fetchMarketSnapshot(null, true);
    state.quotes = q;
    state.pulse = buildPulse(q);
    state.flow = capitalFlow(q);
    save("aip_pulse", state.pulse); save("aip_flow", state.flow);
    state.indices = await fetchQuotes(INDICES.map(function (x) { return { market: x.market, code: x.code }; }));
    renderMarket();
    toast("已刷新");
  } catch (e) {
    toast("刷新失败：" + (e && e.message ? e.message : String(e)));
  }
}

async function addWatch() {
  var input = document.getElementById("inpCode");
  if (!input) return;
  var kw = input.value.trim();
  if (!kw) { toast("请输入代码或名称"); return; }
  var hits = [];
  if (/^\d{6}$/.test(kw)) {
    hits = await fetchQuotes([{ market: marketOf(kw), code: kw }]);
    // 若取不到，尝试另一个市场
    if (!hits.length) hits = await fetchQuotes([{ market: 1 - marketOf(kw), code: kw }]);
  } else {
    if (!state.quotes) { try { state.quotes = await fetchMarketSnapshot(); } catch (e) {} }
    if (state.quotes) {
      hits = state.quotes.filter(function (x) { return x.name.indexOf(kw) >= 0; }).slice(0, 1);
    }
  }
  if (!hits.length) { toast("未找到该股票"); return; }
  var q = hits[0];
  var w = loadWatch();
  if (w.some(function (x) { return x.code === q.code; })) { toast("已在自选中"); return; }
  w.push({ code: q.code, market: q.market, name: q.name, addedAt: Date.now(), addPrice: q.price });
  saveWatch(w);
  input.value = "";
  renderWatch();
  toast("已添加 " + q.name);
}

function saveAllSettings() {
  var st = loadSettings();
  var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  st.baseUrl = g("f_baseUrl") || "https://api.deepseek.com";
  st.model = g("f_model") || "deepseek-chat";
  st.key = g("f_key");
  st.targetPct = +g("f_target");
  st.stopPct = +g("f_stop");
  st.maxPositions = +g("f_max");
  st.positionPct = +g("f_pos");
  st.minAmount = +g("f_amt");
  st.candidateCount = +g("f_cand");
  st.initialCapital = +g("f_cap");
  st.costPct = (+g("f_cost")) / 10000;
  saveSettings(st);
  toast("设置已保存");
}

async function testAI() {
  var st = loadSettings();
  var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
  st.baseUrl = g("f_baseUrl") || st.baseUrl;
  st.model = g("f_model") || st.model;
  st.key = g("f_key") || st.key;
  var out = document.getElementById("testOut");
  if (out) out.textContent = "测试中…";
  try {
    var r = await aiChat("请只回复四个字：连接成功。", st);
    if (out) out.textContent = "✓ 连接成功：" + r.slice(0, 40);
  } catch (e) {
    if (out) out.textContent = "✗ " + (e && e.message ? e.message : String(e));
  }
}

async function netSelfTest() {
  var out = document.getElementById("netOut");
  if (!out) return;
  out.textContent = "检测中…";
  var lines = [];
  lines.push("环境：" + (NATIVE_HTTP ? "APK 原生 HTTP（已绕过 CORS）" : "浏览器 fetch"));
  try {
    var r = await netFetch("https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=2&po=1&np=1&fltt=2&invt=2&fid=f12&fs=m:0+t:6&fields=f12,f14,f2&ut=" + UT, { timeout: 15000 });
    var t = await r.text();
    lines.push("东财行情：HTTP " + r.status + (t ? " · 有数据" : " · 空响应"));
  } catch (e) { lines.push("东财行情：失败 · " + (e && e.message ? e.message : String(e))); }
  try {
    var k = await netFetch("https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.600519&fields1=f1,f2&fields2=f51,f53&klt=101&fqt=1&end=20500101&lmt=2", { timeout: 15000 });
    var t2 = await k.text();
    lines.push("东财K线：HTTP " + k.status + (t2 ? " · 有数据" : " · 空响应"));
  } catch (e) { lines.push("东财K线：失败 · " + (e && e.message ? e.message : String(e))); }
  var st = loadSettings();
  if (!st.key) lines.push("AI 接口：未填写 Key");
  else {
    try { var s = await aiChat("只回复两个字：正常", st); lines.push("AI 接口：OK · " + s.slice(0, 20)); }
    catch (e) { lines.push("AI 接口：失败 · " + (e && e.message ? e.message : String(e))); }
  }
  out.innerHTML = lines.map(function (l) { return "<div style='margin:2px 0'>" + esc(l) + "</div>"; }).join("");
}

function exportData() {
  var data = {
    exportedAt: new Date().toISOString(),
    settings: loadSettings(),
    account: loadAccount(),
    watchlist: loadWatch(),
    plan: state.plan
  };
  var txt = JSON.stringify(data, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast("已复制到剪贴板"); })
      .catch(function () { toast("复制失败"); });
  } else {
    toast("当前环境不支持复制");
  }
}

/* ============================================================
   路由与启动
   ============================================================ */
function render() {
  var t = state.tab;
  var titles = { day: "短线终端", market: "市场行情", watch: "我的自选", paper: "模拟盘", settings: "设置" };
  var sub = document.getElementById("subTitle");
  if (sub) sub.textContent = titles[t] || "";
  if (t === "day") renderDay();
  else if (t === "market") renderMarket();
  else if (t === "watch") renderWatch();
  else if (t === "paper") renderPaper();
  else renderSettings();
  document.querySelectorAll(".tabbar button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tab") === t);
  });
  window.scrollTo(0, 0);
}

document.querySelectorAll(".tabbar button").forEach(function (b) {
  b.addEventListener("click", function () {
    state.tab = b.getAttribute("data-tab");
    render();
  });
});

document.getElementById("btnSearch").addEventListener("click", openSearch);
document.getElementById("btnTheme").addEventListener("click", function () {
  var s = loadSettings();
  var order = ["auto", "light", "dark"];
  var i = order.indexOf(s.theme);
  s.theme = order[(i + 1) % order.length];
  saveSettings(s);
  applyTheme(s.theme);
  toast(s.theme === "auto" ? "跟随系统" : s.theme === "light" ? "日间模式" : "夜间模式");
});

(function boot() {
  var s = loadSettings();
  applyTheme(s.theme);
  state.plan = load("aip_plan", null);
  state.pulse = load("aip_pulse", null);
  state.flow = load("aip_flow", null);
  render();

  // 后台静默拉行情 + 指数
  fetchMarketSnapshot().then(function (q) {
    state.quotes = q;
    state.pulse = buildPulse(q);
    state.flow = capitalFlow(q);
    save("aip_pulse", state.pulse);
    save("aip_flow", state.flow);
    if (state.tab === "market") renderMarket();
  }).catch(function () {});
  fetchQuotes(INDICES.map(function (x) { return { market: x.market, code: x.code }; }))
    .then(function (qs) {
      state.indices = qs;
      if (state.tab === "market") renderMarket();
    }).catch(function () {});

  // 跟随系统主题变化
  try {
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (loadSettings().theme === "auto") applyTheme("auto");
      });
    }
  } catch (e) {}
})();
</script>
